/* Easy-to-use layer (v0.3.0). Loaded after styles.css and responsive.css.
   Goal: a cashier who is 9 or 69 can sell without help — big text, big targets, one obvious next step.
   Sections: base sizes · rail menu · Sell screen · keypad · checkout · photos · phone · print */
:root{--green:#174f3b;--green-2:#2f6b4c;--green-soft:#eaf3e6;--lime:#d8f27a;--ink:#1d3a2e;--muted:#5f7066;--line:#dfe6dc;--warn:#a2421f;--warn-soft:#fdf1e7;--amber-soft:#fff6df;--radius-lg:16px}

/* ---------- Base sizes: nothing important below 14px ---------- */
body{font-size:15px;color:var(--ink)}
h1{font-size:24px}h2{font-size:19px}h3{font-size:16px}small{font-size:13px}
label{font-size:14px;color:var(--muted)}
input,select,textarea{font-size:16px;min-height:48px}
.btn{font-size:15px;min-height:48px;padding:12px 18px;border-radius:10px}
.btn.small{font-size:13px;min-height:40px;padding:8px 12px}
.notice{font-size:14px}
table{font-size:14px}
.subtitle{font-size:14px}
.checkbox{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--ink);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.checkbox input{width:24px;height:24px;min-height:0;flex:none;accent-color:var(--green)}
.icon-btn{min-width:44px;min-height:44px}
#toast{font-size:15px}

/* ---------- Rail menu: icon + word, always visible ---------- */
.shell{grid-template-columns:96px minmax(0,1fr)}
.sidebar.rail{display:flex;flex-direction:column;align-items:center;padding:14px 8px;gap:6px;width:auto;position:sticky;top:0;height:100vh;box-shadow:none}
.rail .brand{padding:0 0 10px}
.rail .brand img{width:44px;height:44px}
.sidebar.rail{scrollbar-width:none}
.rail .nav{display:flex;flex-direction:column;gap:4px;width:100%}
.rail .nav button{position:relative;flex-direction:column;justify-content:center;gap:2px;padding:8px 4px;min-height:64px;width:100%;border-radius:12px;color:var(--muted);font-size:13px;font-weight:700;text-align:center}
.rail .nav button span{display:block}
.rail .nav button small{display:block;font-size:11px;font-weight:500;opacity:.8}
.rail .nav button .icon{width:26px;height:26px}
.rail .nav button.active{background:var(--green);color:#fff}
.rail .nav .badge{display:block;position:absolute;top:6px;right:10px;margin:0;background:var(--warn);color:#fff;font-size:11px;padding:1px 6px;border-radius:99px}
.rail .owner{margin-top:auto;padding-top:10px}
.rail .owner div{display:none}
.topbar{height:64px;font-size:14px}
.breadcrumb .store-name{font-size:16px;color:var(--ink)}

/* ---------- Sell screen ---------- */
.pos-page{padding-top:18px}
.pos-page .mode-banner{margin-bottom:14px;padding:8px 14px}
.pos-page .footnote{display:none}
.session-closed{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--amber-soft);border-color:#efd9a7;color:#6b4f12;font-size:15px}
.session-closed strong{display:block;font-size:17px}
.sell{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.shelf-top{display:flex;gap:12px;margin-bottom:12px}
.shelf-top .search{flex:1;max-width:none}
.shelf-top .search input{font-size:17px;min-height:52px;padding-left:44px}
.sell .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sell .filter{min-height:44px;padding:8px 18px;border-radius:99px;font-size:15px;font-weight:700;background:#fff;border:1px solid var(--line);color:var(--muted)}
.sell .filter.active{background:var(--green);border-color:var(--green);color:#fff}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.product-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:10px 10px 12px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-lg);color:var(--ink);box-shadow:0 1px 2px #1d3a2e0d;transition:transform .08s,border-color .15s}
.product-tile:active{transform:scale(.97)}
.product-tile:hover{border-color:var(--green-2)}
.product-tile.in-cart{border:2.5px solid var(--green)}
.product-tile:disabled{opacity:.5}
.thumb{display:grid;place-items:center;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .icon{width:42%;height:42%;stroke-width:1.5}
.tone-0{background:#f6ead2;color:#8a5a12}.tone-1{background:#e4efd9;color:#3b6d11}.tone-2{background:#efece4;color:#6b675c}.tone-3{background:#e7eef4;color:#2f5d80}
.tile-thumb{width:100%;aspect-ratio:4/3;border-radius:12px;margin-bottom:6px}
.tile-name{font-size:16px;line-height:1.25}
.tile-price{font-size:21px;font-weight:800;font-family:Manrope,Arial,sans-serif}
.tile-price small{font-size:13px;font-weight:600;color:var(--muted)}
.tile-stock{font-size:13px;color:var(--muted)}
.tile-stock.warn{color:var(--warn);font-weight:700}
.tile-badge{position:absolute;top:16px;left:16px;display:flex;align-items:center;gap:4px;background:var(--green);color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px}
.tile-badge .icon{width:14px;height:14px}

.order{position:sticky;top:80px;display:flex;flex-direction:column;max-height:calc(100vh - 100px);background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.order-head{display:flex;justify-content:space-between;align-items:baseline;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.order-head h2 small{font-size:14px;color:var(--muted);font-weight:500}
.order-head span{font-size:14px;color:var(--muted)}
.order-lines{flex:1;overflow-y:auto;padding:4px 14px;min-height:120px}
.order-lines .empty{font-size:15px;color:var(--muted)}
.order-line{display:grid;grid-template-columns:48px minmax(0,1fr) auto;grid-template-areas:"thumb info price" "thumb step remove";gap:6px 10px;align-items:center;padding:12px 0;border-bottom:1px solid #eef2ec}
.line-thumb{grid-area:thumb;width:48px;height:48px;border-radius:10px;align-self:start}
.line-info{grid-area:info;background:none;text-align:left;padding:0;color:var(--ink);min-width:0}
.line-info strong{display:block;font-size:16px;overflow-wrap:anywhere}
.line-info small{display:block;color:var(--muted);font-size:14px;text-decoration:underline dotted;text-underline-offset:3px}
.line-price{grid-area:price;font-size:16px}
.stepper{grid-area:step;display:flex;gap:8px}
.step{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--green);display:grid;place-items:center}
.step .icon{width:20px;height:20px;stroke-width:2.4}
.order-line .remove{grid-area:remove;justify-self:end;background:none;color:#9a6b5c;border-radius:50%}
.order-foot{padding:14px 18px 16px;border-top:1px solid var(--line);background:#fbfcf9}
.order-total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.order-total span{font-size:17px;font-weight:700}
.order-total strong{font-size:32px;font-family:Manrope,Arial,sans-serif;color:var(--green);letter-spacing:-.5px}
.order-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.order-actions .btn{font-size:14px;padding:10px}
.pay-btn{width:100%;min-height:62px;font-size:20px;border-radius:14px}
.pay-btn .icon{width:26px;height:26px}
.order-note{text-align:center;font-size:12px;color:#8a978c;margin-top:8px}

/* ---------- Keypad pop-up ---------- */
dialog.pad-dialog{width:min(470px,calc(100vw - 16px))}
.pad-product{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.pad-thumb{width:64px;height:64px;border-radius:12px}
.pad-product strong{display:block;font-size:18px}
.pad-product small{color:var(--muted)}
.unit-switch{display:grid;grid-template-columns:1fr 1fr;background:#f1f4ee;border-radius:12px;padding:4px;margin-bottom:12px}
.unit-switch button{min-height:46px;border-radius:9px;background:none;font-size:15px;font-weight:700;color:var(--muted)}
.unit-switch button[aria-pressed="true"]{background:#fff;color:var(--green);box-shadow:0 1px 3px #1d3a2e26}
.pad-display{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 16px;border:2px solid var(--green);border-radius:14px;margin-bottom:12px}
.pad-amount{font-size:34px;font-weight:800;font-family:Manrope,Arial,sans-serif}
.pad-price{font-size:19px;font-weight:700;color:var(--green)}
.pad-display.warn{border-color:var(--warn)}.pad-display.warn .pad-price{color:var(--warn)}
.pad-quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pad-quick button,.cash-quick button{min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:16px;font-weight:700;color:var(--ink)}
.cash-quick button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{min-height:58px;border-radius:12px;background:#f1f4ee;font-size:26px;font-weight:700;color:var(--ink);display:grid;place-items:center}
.keypad button:active,.pad-quick button:active,.cash-quick button:active{background:var(--green-soft)}
.keypad .icon{width:28px;height:28px}
dialog.pad-dialog .modal-actions .btn[type="submit"],dialog.checkout-dialog .modal-actions .btn[type="submit"]{flex:1;min-height:58px;font-size:18px}
/* The main button stays reachable even when a pop-up has to scroll (phones). */
dialog.pad-dialog .modal-actions,dialog.checkout-dialog .modal-actions{position:sticky;bottom:0;background:#fff;padding:10px 0 4px;margin-bottom:-4px;z-index:1}

/* ---------- Checkout pop-up ---------- */
dialog.checkout-dialog{width:min(920px,calc(100vw - 16px))}
.checkout-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:22px}
.checkout-grid h3{font-size:17px;margin-bottom:10px}
.checkout-grid h3 small{font-size:14px;color:var(--muted);font-weight:500}
.co-summary{background:#f7f9f4;border-radius:14px;padding:14px}
.sum-line{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.sum-line .line-thumb{grid-area:auto;width:40px;height:40px;align-self:center}
.sum-line small{display:block;color:var(--muted)}
.sum-row,.sum-total{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0}
.sum-total{border-top:2px solid var(--line);padding-top:12px}
.sum-total span{font-size:17px;font-weight:700}
.sum-total strong{font-size:30px;font-family:Manrope,Arial,sans-serif;color:var(--green)}
.pay-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.pay-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin:0;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;color:var(--ink)}
.pay-tile input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.pay-tile .icon{width:24px;height:24px;color:var(--green)}
.pay-tile strong{font-size:16px}
.pay-tile small{font-size:12px;color:var(--muted)}
.pay-tile:has(input:checked){border:2.5px solid var(--green);background:var(--green-soft)}
.pay-tile:has(input:focus-visible){outline:3px solid #88bca2;outline-offset:2px}
.cash-quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.pay-result{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;padding:14px 16px;border-radius:14px;background:var(--green-soft);color:#24502f;margin-top:4px}
.pay-result span{font-size:17px;font-weight:700}
.pay-result strong{font-size:32px;font-family:Manrope,Arial,sans-serif}
.pay-result small{flex-basis:100%;font-size:14px}
.pay-result.warn{background:var(--warn-soft);color:var(--warn)}

/* ---------- Quick buy: kilo pad + payment in one pop-up ---------- */
dialog.quick-dialog{width:min(980px,calc(100vw - 16px))}
.quick-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:22px}
.quick-grid h3{font-size:17px;margin-bottom:10px}.quick-grid h3 small{font-size:14px;color:var(--muted);font-weight:500}
dialog.quick-dialog .modal-actions .btn[type="submit"]{flex:1;min-height:58px;font-size:17px}
dialog.quick-dialog .modal-actions .pay-now{order:3;flex:1.4;font-size:19px}

/* ---------- Receipt: paper slides out of a printer ---------- */
dialog.receipt-dialog{width:min(560px,calc(100vw - 16px))}
.printer{position:relative;z-index:1;display:flex;align-items:center;gap:12px;height:46px;padding:0 18px;background:#1f2a24;border-radius:16px 16px 8px 8px;box-shadow:0 6px 14px #1d3a2e33}
.printer-light{width:9px;height:9px;border-radius:50%;background:#7bd389;animation:printer-blink .35s steps(2) 8}
.printer-slot{flex:1;height:9px;border-radius:5px;background:#060a08;box-shadow:inset 0 2px 3px #000}
.paper-window{display:flex;justify-content:center;overflow:hidden;margin:-23px 0 0;padding:0 8px 18px;filter:drop-shadow(0 3px 5px #1d3a2e2e)}
/* Courier letters are 0.6em wide, so the paper is exactly "columns" letters wide, like the real printer. */
.receipt-paper{--paper-font:min(15px,calc((100vw - 96px) / var(--cols) / .6));font:var(--paper-font)/1.4 'Courier New',Courier,monospace;width:calc(var(--cols) * .6em + 28px);padding:30px 14px 26px;background:#fff;color:#151515;white-space:pre;
 -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50% / 14px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50% / 14px 100%;
 animation:receipt-print-out calc(var(--rows) * 70ms) steps(var(--rows)) both}
/* "Big" lines are printed double height, same width. */
.receipt-paper .big{font-weight:700;transform:scaleY(1.7);margin:.4em 0}
.receipt-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.receipt-actions .btn{flex:1;min-height:56px;font-size:17px}
@keyframes receipt-print-out{from{transform:translateY(-100%)}to{transform:none}}
@keyframes printer-blink{50%{background:#2f4a3a}}
@media (prefers-reduced-motion:reduce){.receipt-paper,.printer-light{animation:none}}
/* Print backup: only the receipt goes to the printer (the page size is set when printing). */
#print-receipt{position:absolute;left:-9999px;top:0}
#print-receipt .receipt-paper{width:auto;padding:0;font-size:inherit;-webkit-mask:none;mask:none;animation:none}
@media print{body.printing-receipt>*:not(#print-receipt){display:none!important}body.printing-receipt #print-receipt{position:static;margin:0 auto}}

/* ---------- Photos ---------- */
.product-cell{display:flex;gap:10px;align-items:center}
.table-thumb{width:44px;height:44px;border-radius:10px}
.photo-pad{display:grid;justify-items:center;gap:14px;text-align:center}
.photo-preview{width:180px;height:180px;border-radius:18px}
.photo-pick{cursor:pointer}

/* ---------- Easy screens (v0.4.0): big numbers and big tiles ---------- */
[hidden]{display:none!important}
.rail .nav .nav-more{display:none}
.easy-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 14px}
.easy-head h1{font-size:28px;margin:0}.easy-head h1 small{font-size:17px;color:var(--muted);font-weight:500}
.easy-head .actions{display:flex;gap:8px;flex-wrap:wrap}
.greeting{font-size:16px;color:var(--muted);margin:-6px 0 14px}
.big-numbers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:14px}
.big-numbers.one{grid-template-columns:minmax(0,1fr)}
.big-number{flex:1;display:flex;flex-direction:column;gap:4px;padding:16px 18px;border-radius:var(--radius-lg);background:#fff;border:1.5px solid var(--line);min-width:0}
.big-number>span{font-size:15px;font-weight:700}.big-number>span small{font-size:14px;font-weight:500;color:var(--muted)}
.big-number strong{font-size:34px;font-family:Manrope,Arial,sans-serif;font-weight:800;letter-spacing:-.5px;line-height:1.15;overflow-wrap:anywhere}
.big-number>small{font-size:14px;color:var(--muted)}
.big-number.good{background:var(--green-soft);border-color:#cfe2c5}.big-number.good strong{color:var(--green)}
.big-number.warn{background:var(--warn-soft);border-color:#f2d3bd}.big-number.warn strong{color:var(--warn)}
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.tile-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:96px;padding:14px 16px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-lg);color:var(--ink);transition:transform .08s,border-color .15s}
.tile:hover{border-color:var(--green-2)}.tile:active{transform:scale(.97)}
.tile .icon{width:30px;height:30px;color:var(--green);margin-bottom:6px}
.tile strong{font-size:17px;line-height:1.2}
.tile small{font-size:14px;color:var(--muted)}
.tile-note{font-size:13px;margin-top:2px}
.tile.good{background:var(--green);border-color:var(--green);color:#fff}.tile.good .icon,.tile.good small{color:#dcebd9}
.tile.warn{background:var(--warn-soft);border-color:#f2d3bd;color:var(--warn)}.tile.warn .icon{color:var(--warn)}
.tile.active{border:2.5px solid var(--green);background:var(--green-soft)}
.period-line{font-size:15px;color:var(--muted);margin:0 0 12px}
.section-label{font-size:19px;margin:22px 0 10px}.section-label small{font-size:15px;color:var(--muted);font-weight:500}
.custom-dates{margin:-6px 0 12px}.custom-dates summary{cursor:pointer;font-weight:700;color:var(--green-2);min-height:40px;display:flex;align-items:center}
.people{display:grid;gap:8px}
.person{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:12px;width:100%;min-height:72px;padding:12px 14px;background:#fff;border:1.5px solid var(--line);border-radius:14px;text-align:left;color:var(--ink)}
.person .avatar{width:48px;height:48px;font-size:16px}
.person-name strong{display:block;font-size:17px;overflow-wrap:anywhere}.person-name small{font-size:14px;color:var(--muted)}
.person-owe{font-size:20px;font-family:Manrope,Arial,sans-serif}
.person.late{border-color:#efc3a6;background:#fffaf6}.person.late .person-name small{color:var(--warn);font-weight:700}
.cards{display:grid;gap:10px}
.card{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:14px 16px;background:#fff;border:1.5px solid var(--line);border-radius:14px}
.card-text strong{display:block;font-size:17px}.card-text small{color:var(--muted)}
.card-amount{font-size:19px;font-family:Manrope,Arial,sans-serif}
.list-rows .row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.printer-panel .tile{min-height:84px}

async function savePhoto(photos,productId,dataUrl){if(!photos.memory){const tx=photos.db.transaction(PHOTO_STORE,'readwrite');tx.objectStore(PHOTO_STORE).put(dataUrl,productId);await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||Error('The photo could not be saved.'));});}photos.items.set(productId,dataUrl);}
async function removePhoto(photos,productId){if(!photos.memory){const tx=photos.db.transaction(PHOTO_STORE,'readwrite');tx.objectStore(PHOTO_STORE).delete(productId);await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||Error('The photo could not be removed.'));});}photos.items.delete(productId);}
// Phone pictures are several MB; a square 320px JPEG (~20 KB) is plenty for a product tile.
function shrinkPhoto(file){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/'))return reject(Error('Choose a picture file.'));const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{const side=Math.min(img.naturalWidth,img.naturalHeight),canvas=document.createElement('canvas');canvas.width=canvas.height=PHOTO_SIZE;canvas.getContext('2d').drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,PHOTO_SIZE,PHOTO_SIZE);URL.revokeObjectURL(url);resolve(canvas.toDataURL('image/jpeg',PHOTO_QUALITY));};img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('This picture could not be opened. Try another one.'));};img.src=url;});}

// Receipt content and layout for thermal receipt printers (58 mm and 80 mm paper).
// One layout feeds all three outputs: the paper on screen, the browser Print backup and Bluetooth printers.
// Pure functions (no screen, no printer) so they can be tested. Amounts are centavos, quantities grams.
// mm = paper width, printMm = the part the print head reaches, columns = letters per line.
const RECEIPT_PAPERS={58:{label:'58 mm',hint:'Small · portable',mm:58,printMm:48,columns:32},80:{label:'80 mm',hint:'Big · desktop',mm:80,printMm:72,columns:48}};
const DEFAULT_PAPER=58;
const RECEIPT_TITLE='SALES SLIP',RECEIPT_THANKS='Salamat po! Balik kayo!',RECEIPT_DISCLAIMER='Not an official receipt';
const RECEIPT_RULE='-',RECEIPT_CURRENCY='P';   // thermal printers have no peso sign, so totals print as "P1,700.00"
const METHOD_NAMES={'Bank Transfer':'Bank'};

const peso=n=>new Intl.NumberFormat('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2}).format(n/100);
const amountOf=(n,unit)=>new Intl.NumberFormat('en-PH',{maximumFractionDigits:3}).format(n)+' '+unit;
const stamp=at=>new Date(at).toLocaleString('en-PH',{timeZone:'Asia/Manila',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'});
function itemAmount(item){const sacks=item.unit==='sack';return `${amountOf(item.quantity/(sacks?item.unitGrams:1000),sacks?(item.quantity===item.unitGrams?'sack':'sacks'):'kg')} x ${peso(item.price)}`;}

// What the receipt says, line by line. type: title · center · text · pair (left … right) · total · rule
// tendered = cash the customer handed over (known only right after checkout); debt = what stays as utang.
function receiptLines(sale,{store,cashier,customer='',payments=[],tendered=0,debt=0}){
 const lines=[{type:'title',left:store.name}];
 if(store.address)lines.push({type:'center',left:store.address});
 lines.push({type:'rule'},{type:'center',left:RECEIPT_TITLE},{type:'text',left:`No. ${sale.ref}`},{type:'text',left:stamp(sale.at)},{type:'text',left:`Cashier: ${cashier}`});
 if(customer)lines.push({type:'text',left:`Customer: ${customer}`});
 lines.push({type:'rule'});
 for(const item of sale.items)lines.push({type:'text',left:item.name},{type:'pair',left:'  '+itemAmount(item),right:peso(item.revenue)});
 lines.push({type:'rule'},{type:'pair',left:'Subtotal',right:peso(sale.subtotal)});
 if(sale.discount)lines.push({type:'pair',left:'Discount',right:'-'+peso(sale.discount)});
 lines.push({type:'total',left:'TOTAL',right:RECEIPT_CURRENCY+peso(sale.total)});
 for(const p of payments){const given=p.method==='Cash'&&tendered>p.amount?tendered:p.amount;lines.push({type:'pair',left:METHOD_NAMES[p.method]||p.method,right:peso(given)});if(p.reference)lines.push({type:'text',left:`  Ref: ${p.reference}`});if(given>p.amount)lines.push({type:'pair',left:'Sukli / Change',right:peso(given-p.amount)});}
 if(debt){lines.push({type:'pair',left:'Utang balance',right:peso(debt)});if(sale.dueDate)lines.push({type:'text',left:`Pay by ${sale.dueDate}`});}
 if(sale.refunded)lines.push({type:'center',left:'*** REFUNDED ***'});
 lines.push({type:'rule'},{type:'center',left:RECEIPT_THANKS},{type:'center',left:RECEIPT_DISCLAIMER});
 return lines;}

// Thermal printers only know plain letters: "Piñas" prints as "Pinas", unknown signs as "?".
const plainText=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/₱/g,RECEIPT_CURRENCY).replace(/[^\x20-\x7E]/g,'?');
function wrap(text,columns){const words=plainText(text).split(' '),out=[];let line='';for(const word of words){const next=line?line+' '+word:word;if(next.length<=columns){line=next;continue;}if(line)out.push(line);line=word;while(line.length>columns){out.push(line.slice(0,columns));line=line.slice(columns);}}if(line||!out.length)out.push(line);return out;}
const centered=(text,columns)=>' '.repeat(Math.floor((columns-text.length)/2))+text;
function pair(left,right,columns){const l=plainText(left),r=plainText(right);return l.length+r.length+1<=columns?[l+' '.repeat(columns-l.length-r.length)+r]:[...wrap(l,columns),' '.repeat(Math.max(0,columns-r.length))+r];}

// Fixed-width rows, exactly as the printer prints them. style: big (title, total) · bold · plain
function receiptRows(lines,columns){return lines.flatMap(line=>{
 if(line.type==='rule')return [{text:RECEIPT_RULE.repeat(columns),style:''}];
 if(line.type==='title')return wrap(line.left.toUpperCase(),columns).map(t=>({text:centered(t,columns),style:'big'}));
 if(line.type==='center')return wrap(line.left,columns).map(t=>({text:centered(t,columns),style:''}));
 if(line.type==='pair')return pair(line.left,line.right,columns).map(text=>({text,style:''}));
 if(line.type==='total')return pair(line.left,line.right,columns).map(text=>({text,style:'big'}));
 return wrap(line.left,columns).map(text=>({text,style:''}));});}

// ESC/POS: the command language of almost every receipt printer.
const ESC=0x1b,GS=0x1d,LF=0x0a,FEED_LINES=4;
const ESC_POS={reset:[ESC,0x40],bold:on=>[ESC,0x45,on?1:0],tall:on=>[GS,0x21,on?0x01:0x00],feed:[ESC,0x64,FEED_LINES],cut:[GS,0x56,0x42,0x00]};
function escPos(rows){const bytes=[...ESC_POS.reset];for(const row of rows){const big=row.style==='big',bold=big||row.style==='bold';bytes.push(...ESC_POS.bold(bold),...ESC_POS.tall(big));for(const ch of plainText(row.text))bytes.push(ch.charCodeAt(0));bytes.push(LF);}bytes.push(...ESC_POS.bold(false),...ESC_POS.tall(false),...ESC_POS.feed,...ESC_POS.cut);return Uint8Array.from(bytes);}

// The receipt printer on this device: paper size, auto-print and a Bluetooth connection.
// Like photos, these settings belong to the device (each counter has its own printer), so they never
// enter the store records, backups or the online Sheet.
// Bluetooth works in Chrome on Android and on computers; iPhone browsers and some older printers cannot,
// so the browser's normal Print is always the backup.
const PRINTER_KEY='storepos-printer-v1';
// Bluetooth services used by common 58 mm / 80 mm ESC/POS printers (Chrome only shows services named here).
const PRINTER_SERVICES=['000018f0-0000-1000-8000-00805f9b34fb','e7810a71-73ae-499d-8c15-faa9aef0c3f2','49535343-fe7d-4ae5-8fa9-9fafd205e455','0000ff00-0000-1000-8000-00805f9b34fb','0000fee7-0000-1000-8000-00805f9b34fb','0000ae30-0000-1000-8000-00805f9b34fb'];
const BLE_CHUNK=20;   // bytes per write: the smallest size every Bluetooth printer accepts
let printerDevice=null,printerChannel=null;

function printerSettings(){const base={paper:DEFAULT_PAPER,autoPrint:false};try{return {...base,...JSON.parse(localStorage.getItem(PRINTER_KEY)||'{}')};}catch{return base;}}
function savePrinterSettings(settings){try{localStorage.setItem(PRINTER_KEY,JSON.stringify(settings));}catch{}}
const bluetoothAvailable=()=>!!globalThis.navigator?.bluetooth;
const printerName=()=>printerDevice?(printerDevice.name||'Bluetooth printer'):'';

async function openChannel(device){const server=await device.gatt.connect();for(const service of await server.getPrimaryServices())for(const c of await service.getCharacteristics())if(c.properties.write||c.properties.writeWithoutResponse)return c;throw Error('This printer did not answer. Turn it off and on, then connect again, or use Print.');}

// Chrome shows its own list of nearby Bluetooth devices; the cashier picks the printer once per visit.
async function connectPrinter(){if(!bluetoothAvailable())throw Error('This browser cannot use Bluetooth. Use Chrome on Android or a computer, or use Print.');
 const device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:PRINTER_SERVICES}).catch(err=>{throw err.name==='NotFoundError'?Error('No printer was chosen.'):err;});
 printerChannel=await openChannel(device);printerDevice=device;device.addEventListener('gattserverdisconnected',()=>{printerChannel=null;});return printerName();}
function forgetPrinter(){try{printerDevice?.gatt.disconnect();}catch{}printerDevice=null;printerChannel=null;}

async function sendToPrinter(bytes){if(!printerDevice)throw Error('Connect a printer in Settings first.');
 if(!printerChannel||!printerDevice.gatt.connected)printerChannel=await openChannel(printerDevice);
 const withReply=printerChannel.properties.write;   // slower but the printer confirms every piece
 for(let i=0;i<bytes.length;i+=BLE_CHUNK){const part=bytes.slice(i,i+BLE_CHUNK);await (withReply?printerChannel.writeValue(part):printerChannel.writeValueWithoutResponse(part));}}

function choiceTiles(name,options,checked,label){return `<div class="pay-methods" role="radiogroup" aria-label="${label}">${options.map(o=>`<label class="pay-tile"><input type="radio" name="${name}" value="${e(o.value)}" ${o.value===checked?'checked':''}>${icon(o.icon)}<strong>${o.label}</strong><small>${o.hint}</small></label>`).join('')}</div>`;}
const initials=name=>e(name.split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase());
const plural=(n,one,many=one+'s')=>`${n} ${n===1?one:many}`;
const bill=centavos=>'₱'+new Intl.NumberFormat('en-PH').format(centavos/100);   // "₱1,000" for counting money

// ---------- Today · Ngayon: three big numbers and two reminders ----------
function dashboard(){const m=metrics(state),low=lowProducts(),session=currentSession(state),owing=state.customers.filter(c=>balance(state,c.id)>0),late=owing.filter(c=>overdue(c.id)).length;
 return pageTitle('Today','Ngayon',button('Sales today','history','secondary','receipt'))+`<p class="greeting">Magandang araw, ${e(state.store.owner)}! Here is ${e(state.store.name)} on ${date(new Date())}.</p><section class="big-numbers">${bigNumber('Sold today','Benta',money(m.revenue),plural(m.sales.length,'sale'),'good')}${bigNumber('Money in the cash box','Pera sa kaha',session?money(expectedCash(state)):'Closed',session?`Open since ${time(session.openedAt)}`:'Open it before selling',session?'':'warn')}${bigNumber('Customers owe you','Utang',money(m.credit),owing.length?plural(owing.length,'person','people')+(late?` · ${late} late`:''):'Nobody owes you',late?'warn':'')}</section><section class="tile-grid two">${low.length?tile(`${plural(low.length,'rice','rice')} running low`,'Paubos na',goTo('inventory'),'box','warn',low.slice(0,3).map(p=>e(p.name)).join(', ')):tile('Stocks are fine','Sapat ang paninda',goTo('inventory'),'box','good')}${session?tile('Cash box is open','Bukas ang kaha',goTo('cash'),'wallet','good'):tile('Open the cash box','Buksan ang kaha',doAction('open'),'wallet','warn')}</section>`;}

function inventory(){const filtered=state.products.filter(p=>(p.name+' '+p.sku).toLowerCase().includes(search.toLowerCase())),kilos=state.products.reduce((a,p)=>a+p.stock,0),worth=state.products.reduce((a,p)=>a+p.stockValue,0);

function cash(){const session=currentSession(state),m=metrics(state),digital=state.payments.filter(x=>day(x.at)===day()&&x.method!=='Cash').reduce((a,x)=>a+x.amount,0),last=[...state.sessions].reverse().find(x=>x.closedAt);
 const top=session?`<section class="big-numbers one">${bigNumber('Should be in the cash box','Dapat nasa kaha',money(expectedCash(state)),`Open since ${time(session.openedAt)} · started with ${money(session.opening)}`,'good')}</section><section class="tile-grid">${tile('Count and close','Bilangin at isara',doAction('close'),'check','good')}${tile('Expense','Gastos',doAction('expense'),'receipt')}${tile('Put money in','Dagdag pera',doAction('cash-move','in'),'plus')}${tile('Take money out','Kuha pera',doAction('cash-move','out'),'minus')}</section>`
  :`<section class="big-numbers one">${bigNumber('The cash box is closed','Sarado ang kaha',last?money(last.actual):'—',last?`Last closed ${date(last.closedAt)} · ${time(last.closedAt)}${last.variance?` · ${last.variance<0?'short':'over'} ${money(Math.abs(last.variance))}`:' · correct'}`:'Open it before the first sale','warn')}</section><section class="tile-grid two">${tile('Open the cash box','Buksan ang kaha',doAction('open'),'wallet','good')}${tile('Expense','Gastos',doAction('expense'),'receipt')}</section>`;
 return pageTitle('Cash','Kaha')+top+`<p class="period-line">Today: expenses ${money(m.expenses)} · GCash, Maya and bank ${money(digital)} (not in the box).</p><h2 class="section-label">History <small lang="tl">· Kasaysayan</small></h2><div class="two-col"><section class="panel"><div class="panel-head"><h2>Money in and out</h2></div>${table(['Reason','Date','Amount'],[...state.cashMoves].reverse().slice(0,10).map(x=>row([e(x.reason),date(x.at),money(x.amount)])))}</section><section class="panel"><div class="panel-head"><h2>Expenses</h2></div>${table(['What','Paid from','Amount'],[...state.expenses].reverse().slice(0,10).map(x=>row([`<strong>${e(x.description)}</strong><small>${e(x.category)} · ${date(x.at)}</small>`,sourceName(x.source),money(x.amount)])))}</section></div><section class="panel spacer"><div class="panel-head"><h2>Closings</h2></div>${table(['Opened','Closed','Should be','Counted','Difference','Note'],[...state.sessions].filter(x=>x.closedAt).reverse().map(x=>row([date(x.openedAt),date(x.closedAt)+' · '+time(x.closedAt),money(x.expected),money(x.actual),`<span class="pill ${x.variance?'warn':''}">${money(x.variance)}</span>`,e(x.reason||'Correct')])) )}</section>`;}

// ---------- Reports · Ulat: pick a period, read three numbers, details below ----------
const REPORT_PERIODS=[{id:'today',label:'Today',tl:'Ngayon'},{id:'week',label:'Last 7 days',tl:'7 araw'},{id:'month',label:'This month',tl:'Ngayong buwan'}];
const WEEK_DAYS=7;
function periodRange(id){const today=day();if(id==='today')return [today,today];if(id==='week'){const d=new Date();d.setUTCDate(d.getUTCDate()-(WEEK_DAYS-1));return [day(d),today];}return [today.slice(0,8)+'01',today];}
// Sales of the last 7 days as a line.
function weekChart(){const week=[];for(let i=WEEK_DAYS-1;i>=0;i--){const d=new Date();d.setUTCDate(d.getUTCDate()-i);week.push({label:d.toLocaleDateString('en-PH',{timeZone:'Asia/Manila',weekday:'short'}),value:metrics(state,day(d)).revenue});}const total=week.reduce((a,x)=>a+x.value,0),max=Math.max(...week.map(x=>x.value),10000);const points=week.map((x,i)=>`${45+i*77},${150-x.value/max*110}`).join(' ');
 return `<section class="panel"><div class="panel-head"><div><h2>Last 7 days <small lang="tl">· 7 araw</small></h2><p>${money(total)} sold</p></div></div><div class="panel-body"><svg class="chart" viewBox="0 0 540 190" role="img" aria-label="Sales over the last seven days: ${week.map(x=>`${x.label} ${money(x.value)}`).join(', ')}"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dce9cd" stop-opacity=".6"/><stop offset="1" stop-color="#f9fbf6" stop-opacity=".2"/></linearGradient></defs>${[0,1,2,3].map(i=>`<path class="grid" d="M42 ${40+i*37}H520"/><text x="0" y="${44+i*37}">${(max/100*(1-i/3)/1000).toFixed(1)}k</text>`).join('')}<polygon points="45,151 ${points} 507,151" fill="url(#fill)"/><polyline points="${points}" fill="none" stroke="#719251" stroke-width="2.5" stroke-linejoin="round"/>${week.map((x,i)=>`<circle cx="${45+i*77}" cy="${150-x.value/max*110}" r="3.5" fill="white" stroke="#719251" stroke-width="2"/><text text-anchor="middle" x="${45+i*77}" y="179">${x.label}</text>`).join('')}</svg></div></section>`;}
function reports(){const m=metrics(state,reportFrom,reportTo);const best=state.products.map(p=>{const lines=m.sales.filter(s=>!s.refunded).flatMap(s=>s.items).filter(x=>x.productId===p.id);return {name:p.name,quantity:lines.reduce((a,x)=>a+x.quantity,0),revenue:lines.reduce((a,x)=>a+x.revenue,0)};}).filter(p=>p.quantity).sort((a,b)=>b.quantity-a.quantity);
 const periods=REPORT_PERIODS.map(p=>{const [from,to]=periodRange(p.id),on=from===reportFrom&&to===reportTo;return tile(p.label,p.tl,`${doAction('period')} data-period="${p.id}" aria-pressed="${on}"`,'calendar',on?'active':'');}).join('');
 return pageTitle('Reports','Ulat',button('Export sales','export-sales','secondary','down'))+`<section class="tile-grid three">${periods}</section><details class="custom-dates"><summary>Other dates · Ibang petsa</summary><div class="report-filters">${field('From','from','date',reportFrom,'id="report-from"')}${field('To','to','date',reportTo)}${button('Show','filter-reports')}</div></details><p class="period-line">${reportFrom===reportTo?date(reportFrom):`${date(reportFrom)} to ${date(reportTo)}`}</p><section class="big-numbers">${bigNumber('Sold','Benta',money(m.revenue),plural(m.sales.length,'sale'),'good')}${bigNumber('Profit','Kita',money(m.net),'After the cost of the rice and expenses',m.net<0?'warn':'')}${bigNumber('Expenses','Gastos',money(m.expenses),'Rent, transport, helpers and more')}</section>${weekChart()}<div class="two-col spacer"><section class="panel list-panel"><h2>Profit breakdown</h2>${rows([['Net sales',money(m.revenue)],['Cost of the rice sold',money(m.cost)],['Gross profit',money(m.profit)],['Expenses',money(m.expenses)],['Profit after expenses',money(m.net)],['Money received (cash, verified digital, utang payments)',money(m.collections)]])}<p class="subtitle">Rice lost or spoiled lowers the stock value; this pilot does not yet count it as an expense.</p></section><section class="panel"><div class="panel-head"><h2>Best-selling rice</h2></div>${table(['Rice','Kilos','Sold (before discounts)'],best.map(p=>row([e(p.name),qty(p.quantity)+' kg',money(p.revenue)])))}<div class="table-foot">Fully refunded sales are left out.</div></section></div><section class="panel spacer"><div class="panel-head"><h2>Sales in this period</h2></div>${salesTable([...m.sales].reverse())}</section>`;}

// ---------- Number pad for money and kilos (Utang, Cash, Stocks) ----------
const PAD_UNITS={peso:{decimals:2,show:v=>'₱'+v},kg:{decimals:PAD_MAX_DECIMALS,show:v=>v+' kg'}};
function keypad(){return `<div class="keypad">${[...'123456789','.','0'].map(k=>`<button type="button" data-key="${k}">${k}</button>`).join('')}<button type="button" data-key="back" aria-label="Erase">${icon('backspace')}</button></div>`;}
// Typing on a keypad: returns the new text, or null when the key is not allowed.
// The first key after a quick amount starts a new number; later keys add digits.
function padType(entry,fresh,key,decimals){if(key==='back')return fresh?'0':entry.slice(0,-1)||'0';if(key==='.'&&!fresh&&entry.includes('.'))return null;const next=fresh?(key==='.'?'0.':key):(entry==='0'&&key!=='.'?key:entry+key);return (next.split('.')[1]||'').length>decimals||next.length>PAD_MAX_LENGTH?null:next;}
// Screen keys and the computer keyboard (except while typing in a box).
function wireKeypad(form,press){form.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>press(b.dataset.key));form.onkeydown=ev=>{if(ev.target.matches('input:not([type="radio"]),select,textarea'))return;if(/^[0-9.]$/.test(ev.key))press(ev.key);else if(ev.key==='Backspace')press('back');else return;ev.preventDefault();};}
// start and quick values are typed text ("1000", "12.5"). warn(value) returns a message that blocks saving, or ''.
// onSubmit(value, formData): value is the typed text, so callers scale it like any form field.
function numberPad({title,intro='',unit='peso',start='0',quick=[],extra='',allowZero=false,warn=()=>'',submit='Save',onSubmit}){const u=PAD_UNITS[unit];let entry=start,fresh=true;
 modal(title,`${intro}<input type="hidden" name="amount"><output class="pad-display" aria-live="polite"><span class="pad-amount"></span><span class="pad-price"></span></output>${quick.length?`<div class="pad-quick">${quick.map(([v,l])=>`<button type="button" data-quick="${v}">${l}</button>`).join('')}</div>`:''}${keypad()}${extra}`,d=>onSubmit(d.amount,d),submit,'pad-dialog');
 const form=$('#modal-form'),save=form.querySelector('[type="submit"]');
 function refresh(){const value=entry.replace(/\.$/,'')||'0',message=warn(value);form.amount.value=value;form.querySelector('.pad-amount').textContent=u.show(entry);form.querySelector('.pad-price').textContent=message;form.querySelector('.pad-display').classList.toggle('warn',!!message);save.disabled=!!message||(!allowZero&&!(Number(value)>0));}
 const quickBox=form.querySelector('.pad-quick');if(quickBox)quickBox.onclick=ev=>{const b=ev.target.closest('[data-quick]');if(!b)return;entry=b.dataset.quick;fresh=true;refresh();};
 wireKeypad(form,key=>{const next=padType(entry,fresh,key,u.decimals);if(next===null)return;entry=next;fresh=false;refresh();});
 refresh();save.focus({preventScroll:true});}

// ---------- Cash box pop-ups ----------
const OPENING_QUICK=[500,1000,2000,3000];                // pesos of change money most stores start with
const COLLECT_QUICK=[100,500,1000];                      // pesos offered when collecting utang
const COLLECT_METHODS=PAY_METHODS.filter(m=>m.value==='Cash'||DIGITAL_METHODS.includes(m.value));
const DENOMINATIONS=[100000,50000,20000,10000,5000,2000,1000,500,100];   // centavos: ₱1,000 bill down to ₱1 coin
const EXPENSE_TYPES=[{value:'Transportation',icon:'truck',label:'Transport',tl:'Pamasahe, gasolina'},{value:'Rent',icon:'store',label:'Rent',tl:'Upa'},{value:'Electricity',icon:'bolt',label:'Electricity',tl:'Kuryente'},{value:'Labor',icon:'users',label:'Helpers',tl:'Sahod'},{value:'Packaging',icon:'box',label:'Plastic, sacks',tl:'Supot'},{value:'Maintenance',icon:'settings',label:'Repairs',tl:'Kumpuni'},{value:'Utilities',icon:'phone',label:'Water, phone',tl:'Tubig, load'},{value:'Miscellaneous',icon:'receipt',label:'Other',tl:'Iba pa'}];
// Closing: count the bills and coins; the app adds them up and shows short (kulang) or over (sobra).
function cashCount(){const expected=expectedCash(state);let typedTotal=false;
 modal('Count the money · Bilangin ang pera',`${bigNumber('Should be in the box','Dapat nasa kaha',money(expected))}<div class="counter">${DENOMINATIONS.map(v=>`<div class="count-row"><span class="denom">${bill(v)}</span><button type="button" class="step" data-count="${v}" data-step="-1" aria-label="One less ${bill(v)}">${icon('minus')}</button><input type="number" inputmode="numeric" min="0" step="1" value="0" name="n${v}" aria-label="How many ${bill(v)}"><button type="button" class="step" data-count="${v}" data-step="1" aria-label="One more ${bill(v)}">${icon('plus')}</button><strong class="count-sum">${bill(0)}</strong></div>`).join('')}</div><button type="button" class="text-link" id="type-total"></button><div id="typed-wrap" hidden>${num('Total counted ₱','typed','0')}</div><input type="hidden" name="actual"><div id="count-result" class="pay-result" aria-live="polite"></div><div class="field" id="reason-wrap" hidden><label for="f-reason">Why is it short or over? · Bakit kulang o sobra?</label><textarea id="f-reason" name="reason" rows="2"></textarea></div>`,async d=>{await commit('close',{actual:scaled(d.actual),reason:d.reason||''});toast('Cash box closed · Sarado na ang kaha.');},'Close the box · Isara','pad-dialog count-dialog');
 const form=$('#modal-form'),save=form.querySelector('[type="submit"]'),pieces=v=>Math.max(0,Math.floor(Number(form['n'+v].value))||0);

function validateBackup(s){if(s?.schema!==1||!s.store||typeof s.store.name!=='string'||typeof s.store.owner!=='string')throw Error('This is not a supported StorePOS backup.');for(const key of ['products','customers','sales','payments','ledger','movements','purchases','expenses','sessions','cashMoves','refunds','audit','processed'])if(!Array.isArray(s[key]))throw Error('Backup is missing '+key);const ids=new Set();for(const p of s.products){if(!p.id||ids.has(p.id)||!['name','sku','category'].every(k=>typeof p[k]==='string')||!['stock','stockValue','price','cost','minimum','sackPrice','sackGrams'].every(k=>Number.isSafeInteger(p[k])&&p[k]>=0)||!p.sackGrams)throw Error('Backup contains invalid product data.');ids.add(p.id);}for(const c of s.customers)if(typeof c.name!=='string'||!Number.isSafeInteger(c.limit)||c.limit<0)throw Error('Backup contains invalid customer data.');for(const key of ['payments','ledger','expenses','cashMoves'])for(const r of s[key])if(!Number.isSafeInteger(r.amount)||!Number.isFinite(Date.parse(r.at)))throw Error('Backup contains invalid financial records.');for(const sale of s.sales)if(!Array.isArray(sale.items)||!Number.isSafeInteger(sale.total)||!Number.isSafeInteger(sale.cost)||!Number.isFinite(Date.parse(sale.at))||sale.items.some(x=>!ids.has(x.productId)||!Number.isSafeInteger(x.quantity)||x.quantity<=0||!Number.isSafeInteger(x.cost)||!Number.isSafeInteger(x.revenue)))throw Error('Backup contains invalid sales records.');if(s.sessions.filter(x=>!x.closedAt).length>1)throw Error('Backup contains overlapping cash sessions.');}

// Same payment rules as before: cash above the total becomes change, anything unpaid becomes utang.
function paymentsFrom(d,total){if(d.method==='Utang')return [];if(d.method==='Split payment')return [{method:'Cash',amount:scaled(d.cash||'0')},{method:d.digitalMethod,amount:scaled(d.digital||'0'),verified:d.verified==='on',reference:d.reference}];const received=scaled(d.received||'0');return [{method:d.method,amount:d.method==='Cash'?Math.min(received,total):received,verified:d.verified==='on',reference:d.reference}];}
function tenderOf(d){return d.method==='Utang'?0:d.method==='Split payment'?scaled(d.cash||'0')+scaled(d.digital||'0'):scaled(d.received||'0');}
function cashSuggestions(total){return [total,...new Set(CASH_ROUND_UPS.map(step=>Math.ceil(total/step)*step).filter(v=>v>total))];}
function payFields(method,total){const amount=(total/100).toFixed(2),verify=check('I checked the money arrived · Pumasok na','verified');
 if(method==='Cash')return `<label>Customer gave · Bigay ng customer</label><div class="cash-quick">${cashSuggestions(total).map((v,i)=>`<button type="button" data-cash="${(v/100).toFixed(2)}">${i?money(v):'Exact · Sakto'}</button>`).join('')}</div>${num('Cash received ₱','received',amount)}`;

:root{
  --tour-green:#164c39; --tour-green-deep:#0f3a2b; --tour-lime:#d8f27a; --tour-lime-deep:#c5e35a;

  border:1.5px solid transparent; font:inherit; font-weight:800; font-size:14.5px; cursor:pointer; line-height:1.2; text-decoration:none}

.tour-btn.go{background:var(--tour-lime); color:var(--tour-green-deep); box-shadow:0 8px 22px rgba(150,190,40,.35)}

.tour-btn.plain{background:#fff; color:var(--tour-green); border-color:var(--tour-line)}

/* ---------- Highlight ring on the part being explained ---------- */

</style><script>// Guided tour for the StorePOS preview (preview.html only).
// Same pattern as the Car Rental demo: a welcome screen with "Explore demo",
// then one step per screen with "Next feature →". The tour only moves between
// screens and highlights one part of each; it never records anything.
(function () {
  'use strict';

  var PRICE_PAGE = './#price';   // where the last step sends visitors who want to buy

  // One step per screen. `page` is the sidebar button to open (data-page),
  // `focus` is the part of that screen to highlight.
  var STEPS = [
    { page: 'pos', focus: '.product-grid',
      title: 'Tap a rice to sell',
      text: 'Tap a rice, press <b>5 kg</b>, choose <b>Cash, GCash or Utang</b> and press <b>Bayad na</b>. One pop-up, and the receipt slides out like a real printer. Try it, nothing is saved here.' },
    { page: 'pos', focus: '.order',
      title: 'Many items? Build an order',
      text: 'Press <b>Add to order</b> instead. <b>+ and −</b> change the amount, then <b>Checkout · Bayad</b> shows the <b>sukli</b>.' },
    { page: 'settings', focus: '.printer-panel',
      title: 'Print real receipts',
      text: 'Works with <b>58 mm and 80 mm receipt printers</b>. Connect a Bluetooth printer in Chrome, or use Print with a USB printer.' },
    { page: 'dashboard', focus: '.big-numbers',
      title: 'Your day in three numbers',
      text: '<b>Sold today, money in the cash box, and utang</b>, big enough to read from across the counter.' },
    { page: 'inventory', focus: '.product-grid',
      title: 'Know your stocks',
      text: 'Kilos left on every rice. Tap one to <b>count it, restock it or add a photo</b>. Low stocks turn red.' },
    { page: 'customers', focus: '.people',
      title: 'A clearer utang notebook',
      text: 'Late payers come first, in red. Tap <b>Singilin</b>, type the amount, and the balance goes down right away.' },
    { page: 'cash', focus: '.tile-grid',
      title: 'Close the day with clarity',
      text: 'At closing, <b>count each bill and coin</b> with + and −. StorePOS shows if the box is <b>kulang or sobra</b>.' },
    { page: 'reports', focus: '.big-numbers',
      title: 'See how the store is doing',
      text: 'Today, last 7 days or this month: <b>sold, profit and expenses</b>, plus best-selling rice. <b>Download to Excel</b> in one click.' }
  ];

  var welcome, card, reopen, current = 0;

  function el(html) {
    var box = document.createElement('div');
    box.innerHTML = html.trim();
    return box.firstChild;
  }

  function build() {
    welcome = el(
      '<div class="tour-welcome" role="dialog" aria-modal="true" aria-labelledby="tour-welcome-title">' +
        '<div class="tour-welcome-box">' +
          '<div class="tour-welcome-top">' +
            '<span class="tour-tag">Free preview</span>' +
            '<h2 id="tour-welcome-title">Welcome to StorePOS</h2>' +
            '<p>A sample rice store with made-up products, customers and sales.</p>' +
          '</div>' +
          '<div class="tour-welcome-body">' +
            '<ul>' +
              '<li><i>1</i><span><b>Sample data only.</b> Click anything you like. Nothing is saved.</span></li>' +
              '<li><i>2</i><span>Press <b>Next feature →</b> to follow the ' + STEPS.length + '-step tour.</span></li>' +
              '<li><i>3</i><span>Reload the page anytime to start fresh.</span></li>' +
            '</ul>' +
            '<button class="tour-btn go" type="button" data-tour="start">Explore demo →</button>' +
            '<button class="tour-btn link" type="button" data-tour="skip">I\'ll look around on my own</button>' +
          '</div>' +
        '</div>' +
      '</div>');

    card = el(
      '<section class="tour-card" aria-live="polite" aria-label="Guided tour" hidden>' +
        '<div class="tour-card-head"><span class="tour-count"></span>' +
          '<button class="tour-close" type="button" data-tour="end" aria-label="Close the tour">×</button></div>' +
        '<h3></h3><p></p>' +
        '<div class="tour-dots">' + STEPS.map(function () { return '<span></span>'; }).join('') + '</div>' +
        '<div class="tour-actions">' +
          '<button class="tour-btn plain" type="button" data-tour="back">← Back</button>' +
          '<button class="tour-btn go" type="button" data-tour="next"></button>' +
        '</div>' +
      '</section>');

    reopen = el('<button class="tour-reopen" type="button" data-tour="restart" hidden><i>▶</i>Guided tour</button>');

    document.body.appendChild(welcome);
    document.body.appendChild(card);
    document.body.appendChild(reopen);
    document.body.addEventListener('click', onClick);
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape' && !welcome.hidden) skip();
    });
    welcome.querySelector('[data-tour="start"]').focus();
  }

  function onClick(ev) {
    var target = ev.target.closest('[data-tour]');
    if (!target) return;
    var act = target.getAttribute('data-tour');
    if (act === 'start') { welcome.hidden = true; show(0); }
    else if (act === 'skip') skip();
    else if (act === 'next') next();
    else if (act === 'back') show(current - 1);
    else if (act === 'end') end();
    else if (act === 'restart') { reopen.hidden = true; show(0); }
  }

  function skip() {
    welcome.hidden = true;
    reopen.hidden = false;
  }

  function next() {
    if (current < STEPS.length - 1) show(current + 1);
    else window.location.href = PRICE_PAGE;
  }

  function end() {
    clearFocus();
    card.hidden = true;
    document.body.classList.remove('tour-on');
    reopen.hidden = false;
  }

  function clearFocus() {
    document.querySelectorAll('.tour-focus').forEach(function (x) { x.classList.remove('tour-focus'); });
  }

  // Opens the step's screen the same way a click on the sidebar would, then highlights its part.
  function show(index) {
    if (index < 0 || index >= STEPS.length) return;
    current = index;
    var step = STEPS[index];
    var last = index === STEPS.length - 1;

    var navButton = document.querySelector('[data-page="' + step.page + '"]');
    if (navButton && !navButton.classList.contains('active')) navButton.click();
    closeMobileMenu();

    card.querySelector('.tour-count').textContent = 'Feature ' + (index + 1) + ' of ' + STEPS.length;
    card.querySelector('h3').textContent = step.title;
    card.querySelector('p').innerHTML = step.text;
    card.querySelectorAll('.tour-dots span').forEach(function (dot, i) { dot.classList.toggle('done', i <= index); });
    card.querySelector('[data-tour="back"]').hidden = index === 0;
    card.querySelector('[data-tour="next"]').textContent = last ? 'Get StorePOS · ₱5,000 →' : 'Next feature →';
    card.hidden = false;
    document.body.classList.add('tour-on');

    clearFocus();
    var part = document.querySelector('.workspace ' + step.focus);
    if (part) {
      part.classList.add('tour-focus');
      part.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  // On phones the sidebar slides over the screen; keep it closed during the tour.
  function closeMobileMenu() {
    var sidebar = document.querySelector('.sidebar.open');
    var menu = document.querySelector('.mobile-menu');
    if (sidebar && menu) menu.click();
  }

  // The app draws itself after it loads its sample store; start once the sidebar exists.
  function whenAppReady(callback) {
    if (document.querySelector('[data-page]')) return callback();
    var watcher = new MutationObserver(function () {
      if (!document.querySelector('[data-page]')) return;
      watcher.disconnect();
      callback();
    });
    watcher.observe(document.getElementById('app'), { childList: true, subtree: true });
  }

  whenAppReady(build);
})();
</script></body></html>
