/* Easy-to-use layer (v0.3.0). Loaded after styles.css and responsive.css.
   Goal: a cashier who is 9 or 69 can sell without help — big text, big targets, one obvious next step.
   Sections: base sizes · rail menu · Sell screen · keypad · checkout · photos · phone · print */
:root{--green:#174f3b;--green-2:#2f6b4c;--green-soft:#eaf3e6;--lime:#d8f27a;--ink:#1d3a2e;--muted:#5f7066;--line:#dfe6dc;--warn:#a2421f;--warn-soft:#fdf1e7;--amber-soft:#fff6df;--radius-lg:16px}

/* ---------- Base sizes: nothing important below 14px ---------- */
body{font-size:15px;color:var(--ink)}
h1{font-size:24px}h2{font-size:19px}h3{font-size:16px}small{font-size:13px}
label{font-size:14px;color:var(--muted)}
input,select,textarea{font-size:16px;min-height:48px}
.btn{font-size:15px;min-height:48px;padding:12px 18px;border-radius:10px}
.btn.small{font-size:13px;min-height:40px;padding:8px 12px}
.notice{font-size:14px}
table{font-size:14px}
.subtitle{font-size:14px}
.checkbox{display:flex;align-items:center;gap:12px;font-size:15px;color:var(--ink);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
.checkbox input{width:24px;height:24px;min-height:0;flex:none;accent-color:var(--green)}
.icon-btn{min-width:44px;min-height:44px}
#toast{font-size:15px}

/* ---------- Rail menu: icon + word, always visible ---------- */
.shell{grid-template-columns:96px minmax(0,1fr)}
.sidebar.rail{display:flex;flex-direction:column;align-items:center;padding:14px 8px;gap:6px;width:auto;position:sticky;top:0;height:100vh;box-shadow:none}
.rail .brand{padding:0 0 10px}
.rail .brand img{width:44px;height:44px}
.sidebar.rail{scrollbar-width:none}
.rail .nav{display:flex;flex-direction:column;gap:4px;width:100%}
.rail .nav button{position:relative;flex-direction:column;justify-content:center;gap:2px;padding:8px 4px;min-height:64px;width:100%;border-radius:12px;color:var(--muted);font-size:13px;font-weight:700;text-align:center}
.rail .nav button span{display:block}
.rail .nav button small{display:block;font-size:11px;font-weight:500;opacity:.8}
.rail .nav button .icon{width:26px;height:26px}
.rail .nav button.active{background:var(--green);color:#fff}
.rail .nav .badge{display:block;position:absolute;top:6px;right:10px;margin:0;background:var(--warn);color:#fff;font-size:11px;padding:1px 6px;border-radius:99px}
.rail .owner{margin-top:auto;padding-top:10px}
.rail .owner div{display:none}
.topbar{height:64px;font-size:14px}
.breadcrumb .store-name{font-size:16px;color:var(--ink)}

/* ---------- Sell screen ---------- */
.pos-page{padding-top:18px}
.pos-page .mode-banner{margin-bottom:14px;padding:8px 14px}
.pos-page .footnote{display:none}
.session-closed{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--amber-soft);border-color:#efd9a7;color:#6b4f12;font-size:15px}
.session-closed strong{display:block;font-size:17px}
.sell{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
.shelf-top{display:flex;gap:12px;margin-bottom:12px}
.shelf-top .search{flex:1;max-width:none}
.shelf-top .search input{font-size:17px;min-height:52px;padding-left:44px}
.sell .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.sell .filter{min-height:44px;padding:8px 18px;border-radius:99px;font-size:15px;font-weight:700;background:#fff;border:1px solid var(--line);color:var(--muted)}
.sell .filter.active{background:var(--green);border-color:var(--green);color:#fff}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.product-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:10px 10px 12px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius-lg);color:var(--ink);box-shadow:0 1px 2px #1d3a2e0d;transition:transform .08s,border-color .15s}
.product-tile:active{transform:scale(.97)}
.product-tile:hover{border-color:var(--green-2)}
.product-tile.in-cart{border:2.5px solid var(--green)}
.product-tile:disabled{opacity:.5}
.thumb{display:grid;place-items:center;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .icon{width:42%;height:42%;stroke-width:1.5}
.tone-0{background:#f6ead2;color:#8a5a12}.tone-1{background:#e4efd9;color:#3b6d11}.tone-2{background:#efece4;color:#6b675c}.tone-3{background:#e7eef4;color:#2f5d80}
.tile-thumb{width:100%;aspect-ratio:4/3;border-radius:12px;margin-bottom:6px}
.tile-name{font-size:16px;line-height:1.25}
.tile-price{font-size:21px;font-weight:800;font-family:Manrope,Arial,sans-serif}
.tile-price small{font-size:13px;font-weight:600;color:var(--muted)}
.tile-stock{font-size:13px;color:var(--muted)}
.tile-stock.warn{color:var(--warn);font-weight:700}
.tile-badge{position:absolute;top:16px;left:16px;display:flex;align-items:center;gap:4px;background:var(--green);color:#fff;font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px}
.tile-badge .icon{width:14px;height:14px}

.order{position:sticky;top:80px;display:flex;flex-direction:column;max-height:calc(100vh - 100px);background:#fff;border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden}
.order-head{display:flex;justify-content:space-between;align-items:baseline;padding:16px 18px 10px;border-bottom:1px solid var(--line)}
.order-head h2 small{font-size:14px;color:var(--muted);font-weight:500}
.order-head span{font-size:14px;color:var(--muted)}
.order-lines{flex:1;overflow-y:auto;padding:4px 14px;min-height:120px}
.order-lines .empty{font-size:15px;color:var(--muted)}
.order-line{display:grid;grid-template-columns:48px minmax(0,1fr) auto;grid-template-areas:"thumb info price" "thumb step remove";gap:6px 10px;align-items:center;padding:12px 0;border-bottom:1px solid #eef2ec}
.line-thumb{grid-area:thumb;width:48px;height:48px;border-radius:10px;align-self:start}
.line-info{grid-area:info;background:none;text-align:left;padding:0;color:var(--ink);min-width:0}
.line-info strong{display:block;font-size:16px;overflow-wrap:anywhere}
.line-info small{display:block;color:var(--muted);font-size:14px;text-decoration:underline dotted;text-underline-offset:3px}
.line-price{grid-area:price;font-size:16px}
.stepper{grid-area:step;display:flex;gap:8px}
.step{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:var(--green);display:grid;place-items:center}
.step .icon{width:20px;height:20px;stroke-width:2.4}
.order-line .remove{grid-area:remove;justify-self:end;background:none;color:#9a6b5c;border-radius:50%}
.order-foot{padding:14px 18px 16px;border-top:1px solid var(--line);background:#fbfcf9}
.order-total{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.order-total span{font-size:17px;font-weight:700}
.order-total strong{font-size:32px;font-family:Manrope,Arial,sans-serif;color:var(--green);letter-spacing:-.5px}
.order-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.order-actions .btn{font-size:14px;padding:10px}
.pay-btn{width:100%;min-height:62px;font-size:20px;border-radius:14px}
.pay-btn .icon{width:26px;height:26px}
.order-note{text-align:center;font-size:12px;color:#8a978c;margin-top:8px}

/* ---------- Keypad pop-up ---------- */
dialog.pad-dialog{width:min(470px,calc(100vw - 16px))}
.pad-product{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.pad-thumb{width:64px;height:64px;border-radius:12px}
.pad-product strong{display:block;font-size:18px}
.pad-product small{color:var(--muted)}
.unit-switch{display:grid;grid-template-columns:1fr 1fr;background:#f1f4ee;border-radius:12px;padding:4px;margin-bottom:12px}
.unit-switch button{min-height:46px;border-radius:9px;background:none;font-size:15px;font-weight:700;color:var(--muted)}
.unit-switch button[aria-pressed="true"]{background:#fff;color:var(--green);box-shadow:0 1px 3px #1d3a2e26}
.pad-display{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 16px;border:2px solid var(--green);border-radius:14px;margin-bottom:12px}
.pad-amount{font-size:34px;font-weight:800;font-family:Manrope,Arial,sans-serif}
.pad-price{font-size:19px;font-weight:700;color:var(--green)}
.pad-display.warn{border-color:var(--warn)}.pad-display.warn .pad-price{color:var(--warn)}
.pad-quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pad-quick button,.cash-quick button{min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:#fff;font-size:16px;font-weight:700;color:var(--ink)}
.cash-quick button[aria-pressed="true"]{border-color:var(--green);background:var(--green-soft)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{min-height:58px;border-radius:12px;background:#f1f4ee;font-size:26px;font-weight:700;color:var(--ink);display:grid;place-items:center}
.keypad button:active,.pad-quick button:active,.cash-quick button:active{background:var(--green-soft)}
.keypad .icon{width:28px;height:28px}
dialog.pad-dialog .modal-actions .btn[type="submit"],dialog.checkout-dialog .modal-actions .btn[type="submit"]{flex:1;min-height:58px;font-size:18px}
/* The main button stays reachable even when a pop-up has to scroll (phones). */
dialog.pad-dialog .modal-actions,dialog.checkout-dialog .modal-actions{position:sticky;bottom:0;background:#fff;padding:10px 0 4px;margin-bottom:-4px;z-index:1}

/* ---------- Checkout pop-up ---------- */
dialog.checkout-dialog{width:min(920px,calc(100vw - 16px))}
.checkout-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:22px}
.checkout-grid h3{font-size:17px;margin-bottom:10px}
.checkout-grid h3 small{font-size:14px;color:var(--muted);font-weight:500}
.co-summary{background:#f7f9f4;border-radius:14px;padding:14px}
.sum-line{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.sum-line .line-thumb{grid-area:auto;width:40px;height:40px;align-self:center}
.sum-line small{display:block;color:var(--muted)}
.sum-row,.sum-total{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0}
.sum-total{border-top:2px solid var(--line);padding-top:12px}
.sum-total span{font-size:17px;font-weight:700}
.sum-total strong{font-size:30px;font-family:Manrope,Arial,sans-serif;color:var(--green)}
.pay-methods{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.pay-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin:0;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;color:var(--ink)}
.pay-tile input{position:absolute;opacity:0;width:1px;height:1px;min-height:0}
.pay-tile .icon{width:24px;height:24px;color:var(--green)}
.pay-tile strong{font-size:16px}
.pay-tile small{font-size:12px;color:var(--muted)}
.pay-tile:has(input:checked){border:2.5px solid var(--green);background:var(--green-soft)}
.pay-tile:has(input:focus-visible){outline:3px solid #88bca2;outline-offset:2px}
.cash-quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.pay-result{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;padding:14px 16px;border-radius:14px;background:var(--green-soft);color:#24502f;margin-top:4px}
.pay-result span{font-size:17px;font-weight:700}
.pay-result strong{font-size:32px;font-family:Manrope,Arial,sans-serif}
.pay-result small{flex-basis:100%;font-size:14px}
.pay-result.warn{background:var(--warn-soft);color:var(--warn)}

/* ---------- Photos ---------- */
.product-cell{display:flex;gap:10px;align-items:center}
.table-thumb{width:44px;height:44px;border-radius:10px}
.photo-pad{display:grid;justify-items:center;gap:14px;text-align:center}
.photo-preview{width:180px;height:180px;border-radius:18px}
.photo-pick{cursor:pointer}

/* Short screens (laptops, tablets sideways): keep the whole keypad visible without scrolling. */
@media (max-height:860px){
 .modal-head{padding:14px 22px 8px}
 .pad-product{margin-bottom:8px}.pad-thumb{width:48px;height:48px}
 .unit-switch{margin-bottom:8px}.unit-switch button{min-height:40px}
 .pad-display{padding:6px 14px;margin-bottom:8px}.pad-amount{font-size:28px}
 .pad-quick{grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px}.pad-quick button{min-height:42px;font-size:14px;padding:0 2px}
 .keypad{gap:6px}.keypad button{min-height:46px;font-size:22px}
 dialog.pad-dialog .modal-actions .btn[type="submit"],dialog.checkout-dialog .modal-actions .btn[type="submit"]{min-height:50px}
 .pay-methods{gap:6px;margin-bottom:10px}.pay-tile{padding:8px 10px}

}

/* ---------- Tablet ---------- */
@media (max-width:1100px){

 .product-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
@media (max-width:900px){

 .sell{grid-template-columns:minmax(0,1fr)}

}

@media (max-width:650px){

 .rail .nav button small{display:none}
 .rail .nav button .icon{width:24px;height:24px}
 .workspace{padding-bottom:100px}
 .pos-page{padding-bottom:170px}
 .topbar{height:56px}
 .breadcrumb .page-name,.breadcrumb>span{display:none}
 .product-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

 .shelf-top .btn{padding:10px 12px}

 .pay-methods{grid-template-columns:repeat(2,1fr)}
 .pad-amount{font-size:30px}
 .keypad button{min-height:54px}
 dialog{max-height:94dvh}
}
@media print{.sidebar.rail{display:none!important}}

 if(type==='profile'){need(data.name.trim(),'Enter a store name.');s.store={name:data.name.trim(),owner:data.owner.trim()||actor,address:data.address.trim()};}

 }else throw Error('Unknown action.');

function metrics(s,from=day(),to=from){const inRange=x=>day(x.at)>=from&&day(x.at)<=to;const sales=s.sales.filter(inRange),refunds=s.refunds.filter(inRange);const revenue=sales.reduce((a,x)=>a+x.total,0)-refunds.reduce((a,x)=>a+x.revenue,0);const cost=sales.reduce((a,x)=>a+x.cost,0)-refunds.reduce((a,x)=>a+x.cost,0);const expenses=s.expenses.filter(inRange).reduce((a,x)=>a+x.amount,0);return {revenue,cost,profit:revenue-cost,expenses,net:revenue-cost-expenses,collections:s.payments.filter(inRange).reduce((a,x)=>a+x.amount,0),credit:s.ledger.reduce((a,x)=>a+x.amount,0),cash:expectedCash(s),sales,refunds};}

const request=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});
async function openDB(){if(window.STOREPOS_PREVIEW)return {preview:true,state:undefined};const r=indexedDB.open('storepos-pilot-v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('store');return request(r);}
async function read(db){if(db.preview)return db.state;return request(db.transaction('store').objectStore('store').get('state'));}
function save(db,next,revision){if(db.preview){if((db.state?.revision??-1)!==revision)return Promise.reject(Error('Preview changed. Reload to restart.'));db.state=structuredClone(next);return Promise.resolve();}return new Promise((resolve,reject)=>{const tx=db.transaction('store','readwrite');const store=tx.objectStore('store');const r=store.get('state');let conflict=false;r.onsuccess=()=>{if((r.result?.revision??-1)!==revision){conflict=true;tx.abort();}else store.put(next,'state');};tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||Error('Unable to save data.'));tx.onabort=()=>reject(Error(conflict?'Another tab changed your store. Reload and try again.':'Saving failed. Your transaction was not completed.'));});}

const online=window.STOREPOS_ONLINE===true;
let cloudUser=null;
function setCloudUser(user){cloudUser=user;}
function cloudToken(){return sessionStorage.getItem('storepos-session')||'';}
function cloudAccept(result){sessionStorage.setItem('storepos-session',result.token);cloudUser=result.user;}
function cloudForget(){sessionStorage.removeItem('storepos-session');cloudUser=null;}
function pendingCommand(){try{return JSON.parse(sessionStorage.getItem('storepos-pending')||'null');}catch{return null;}}
function clearPending(){sessionStorage.removeItem('storepos-pending');}
function cloudCall(method,...args){return new Promise((resolve,reject)=>{if(!navigator.onLine)return reject(Error('You’re offline. Connect to the internet before saving.'));const runner=window.google?.script?.run;if(!runner)return reject(Error('Open the deployed Apps Script web link to connect to your store.'));runner.withSuccessHandler(resolve).withFailureHandler(error=>reject(Error(error.message||'The server could not confirm this action.')))[method](...args);});}
async function cloudCommand(type,data,id,revision){const existing=pendingCommand();const same=existing&&existing.type===type&&JSON.stringify(existing.data)===JSON.stringify(data);if(existing&&!same)throw Error('A previous transaction needs confirmation. Use Check pending save before starting another action.');const command=existing||{id:id||crypto.randomUUID(),type,data,expectedRevision:revision};sessionStorage.setItem('storepos-pending',JSON.stringify(command));let result;try{result=await cloudCall('apiCommand',cloudToken(),command);}catch(err){throw Error(err.message+' Use Check pending save to confirm before trying a different action.');}clearPending();if(result.rejected)throw Error(result.message);return result;}

// Product photos, kept apart from the store records.
// Photos only decorate the Sell screen, so they live in their own small database on this device:
// they never enter the sales/stock state, backups, or the online Google Sheet.
// The preview keeps photos in memory only, like the rest of its sample data.
const PHOTO_DB='storepos-photos-v1',PHOTO_STORE='photos',PHOTO_SIZE=320,PHOTO_QUALITY=.82;
const photoRequest=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});
async function openPhotos(){const memory={memory:true,items:new Map()};if(window.STOREPOS_PREVIEW||!window.indexedDB)return memory;try{const r=indexedDB.open(PHOTO_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(PHOTO_STORE);const db=await photoRequest(r),items=new Map();await new Promise((resolve,reject)=>{const cursor=db.transaction(PHOTO_STORE).objectStore(PHOTO_STORE).openCursor();cursor.onsuccess=()=>{const c=cursor.result;if(!c)return resolve();items.set(c.key,c.value);c.continue();};cursor.onerror=()=>reject(cursor.error);});return {db,items};}catch{return memory;}}
function photoOf(photos,productId){return photos?.items.get(productId)||'';}
async function savePhoto(photos,productId,dataUrl){if(!photos.memory){const tx=photos.db.transaction(PHOTO_STORE,'readwrite');tx.objectStore(PHOTO_STORE).put(dataUrl,productId);await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||Error('The photo could not be saved.'));});}photos.items.set(productId,dataUrl);}
async function removePhoto(photos,productId){if(!photos.memory){const tx=photos.db.transaction(PHOTO_STORE,'readwrite');tx.objectStore(PHOTO_STORE).delete(productId);await new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||Error('The photo could not be removed.'));});}photos.items.delete(productId);}
// Phone pictures are several MB; a square 320px JPEG (~20 KB) is plenty for a product tile.

function renderBase(){const title=nav.find(x=>x[0]===page)?.[2]||'Transaction history';$('#app').innerHTML=`<div class="shell"><aside class="sidebar rail"><div class="brand"><img src="icon.svg" alt="StorePOS"></div><nav class="nav" aria-label="Main navigation">${nav.map(([id,ico,label,local])=>`<button data-page="${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}>${icon(ico)}<span>${label}</span>${local?`<small lang="tl">${local}</small>`:''}${id==='inventory'&&lowProducts().length?`<span class="badge" aria-label="${lowProducts().length} low on stock">${lowProducts().length}</span>`:''}</button>`).join('')}</nav><div class="owner" title="${e(state.store.owner)}"><span class="avatar">${e((state.store.owner||'Owner').slice(0,2).toUpperCase())}</span></div></aside><main class="main"><header class="topbar"><div class="breadcrumb"><strong class="store-name">${e(state.store.name)}</strong><span>/</span><span class="page-name">${title}</span></div><div class="top-actions"><span class="saved"><span class="dot"></span> Saved on this device</span><span class="top-date">${new Date().toLocaleDateString('en-PH',{timeZone:'Asia/Manila',month:'short',day:'numeric',year:'numeric'})}</span></div></header><div class="workspace ${page==='pos'?'pos-page':''}">${({dashboard,inventory,purchases,customers,cash,reports,settings,pos,history}[page]||dashboard)()}<footer class="footnote"><span>${state.demo?'Sample data · ':''}StorePOS Lite &nbsp; / &nbsp; Made for your everyday business</span><span>${currentSession(state)?'● Cash session open':'○ Cash session closed'} &nbsp; · &nbsp; Internal records only</span></footer></div></main></div>`;bind();}
function dashboard(){const m=metrics(state),low=lowProducts(),week=[];for(let i=6;i>=0;i--){const d=new Date();d.setUTCDate(d.getUTCDate()-i);week.push({label:d.toLocaleDateString('en-PH',{timeZone:'Asia/Manila',weekday:'short'}),value:metrics(state,day(d)).revenue});}const total=week.reduce((a,x)=>a+x.value,0),max=Math.max(...week.map(x=>x.value),10000);const points=week.map((x,i)=>`${45+i*77},${150-x.value/max*110}`).join(' ');const creditCustomers=state.customers.filter(c=>balance(state,c.id)>0).sort((a,b)=>balance(state,b.id)-balance(state,a.id));
 return head('A clear view of your business.',`Here’s how ${e(state.store.name)} is doing today.`,button('View reports','reports','secondary','chart')+button('New sale','pos','','plus'))+`<section class="welcome"><div><h2>Magandang araw, ${e(state.store.owner)} <span style="font-weight:400">☀</span></h2><p>A little clarity goes a long way. Keep track of your benta, stocks,<br class="desktop"> and every peso that comes in and out.</p><div class="welcome-note">${icon('check')} ${m.sales.length} sales recorded today &nbsp; · &nbsp; ${currentSession(state)?'Your store is ready for business':'Open your cash session to start selling'}</div></div><div class="welcome-mark">${icon('grain').replace('class="icon"','style="width:88px;height:88px;fill:none;stroke:currentColor;stroke-width:1"')}</div></section><div class="section-title"><h2>Today at a glance</h2><span class="period">${icon('calendar')} Today, ${date(new Date())}</span></div><section class="stats">${stat('Total sales / Benta',money(m.revenue),`${m.sales.length} completed transactions`,'cart',true)}${stat('Payments collected',money(m.collections),'Cash + verified digital payments','wallet')}${stat('Gross profit',money(m.profit),'Sales less recorded cost of goods','chart')}${stat('Operating expenses',money(m.expenses),'Keep the everyday costs in view','receipt')}</section><div class="middle-grid"><section class="panel"><div class="panel-head"><div><h2>Sales performance</h2><p>A little progress, every day.</p></div><span class="pill">Last 7 days</span></div><div class="panel-body"><div class="section-title"><div class="chart-total">${money(total)}</div><div class="legend"><span class="dot"></span> Sales / Benta</div></div><svg class="chart" viewBox="0 0 540 190" role="img" aria-label="Sales over the last seven days: ${week.map(x=>`${x.label} ${money(x.value)}`).join(', ')}"><defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dce9cd" stop-opacity=".6"/><stop offset="1" stop-color="#f9fbf6" stop-opacity=".2"/></linearGradient></defs>${[0,1,2,3].map(i=>`<path class="grid" d="M42 ${40+i*37}H520"/><text x="0" y="${44+i*37}">${(max/100*(1-i/3)/1000).toFixed(1)}k</text>`).join('')}<polygon points="45,151 ${points} 507,151" fill="url(#fill)"/><polyline points="${points}" fill="none" stroke="#719251" stroke-width="2.5" stroke-linejoin="round"/>${week.map((x,i)=>`<circle cx="${45+i*77}" cy="${150-x.value/max*110}" r="3.5" fill="white" stroke="#719251" stroke-width="2"/><text text-anchor="middle" x="${45+i*77}" y="179">${x.label}</text>`).join('')}</svg></div></section><section class="panel"><div class="panel-head"><div><h2>A little stock check</h2><p>Let’s keep your shelves ready.</p></div><span class="pill warn">${low.length} low stock</span></div><div class="panel-body">${low.length?low.slice(0,3).map(p=>`<div class="stock-item"><div class="grain-icon">${icon('grain')}</div><div><strong>${e(p.name)}</strong><small>Minimum: ${qty(p.minimum)} kg</small></div><div class="stock-count"><strong>${qty(p.stock)} kg</strong><small>${p.stock?'Running low':'Out of stock'}</small></div></div>`).join(''):'<div class="empty">Your stocks are looking good.</div>'}<div class="row"><span>Cash on hand</span><strong>${money(m.cash)}</strong></div><div class="row"><span>Expected in your register</span>${button('Manage stock','inventory','ghost','arrow')}</div></div></section></div><div class="bottom-grid"><section class="panel"><div class="panel-head"><div><h2>Recent transactions</h2><p>Every sale, accounted for.</p></div>${button('View all','history','ghost','arrow')}</div>${salesTable(state.sales.slice(-4).reverse(),true)}<div class="table-foot"><span>Amounts shown in Philippine pesos</span><span>${m.sales.length} sales today</span></div></section><section class="panel"><div class="panel-head"><div><h2>Customer credit / Utang</h2><p>A friendly reminder of what’s due.</p></div>${icon('users')}</div><div class="panel-body"><div class="credit-summary"><div><small>Total outstanding</small><div><strong>${money(m.credit)}</strong></div></div><span class="pill warn">${creditCustomers.length} customers</span></div>${creditCustomers.slice(0,3).map(c=>`<div class="stock-item"><span class="avatar">${e(c.name.split(' ').map(n=>n[0]).slice(0,2).join(''))}</span><div><strong>${e(c.name)}</strong><small>${overdue(c.id)?'Payment overdue':'Outstanding balance'}</small></div><div class="stock-count"><strong>${money(balance(state,c.id))}</strong></div></div>`).join('')}${button('Manage customer credit','customers','ghost','arrow')}</div></section></div>`;}
function saleDebt(sale){return state.ledger.filter(x=>x.saleId===sale.id).reduce((a,x)=>a+x.amount,0);}
function overdue(id){return state.sales.some(s=>s.customerId===id&&saleDebt(s)>0&&s.dueDate<day());}
function salesTable(sales,compact=false){return table(compact?['Transaction','Customer','Amount','Status']:['Transaction','Customer','Amount','Payment','Status',''],sales.map(s=>{const debt=saleDebt(s),status=s.refunded?'Refunded':debt===s.total&&debt?'Unpaid':debt?'Partially paid':'Paid',customer=state.customers.find(c=>c.id===s.customerId);const cells=[`<button class="text-link" data-action="receipt" data-id="${s.id}">${e(s.ref)}</button><small>${date(s.at)} · ${time(s.at)}</small>`,e(customer?.name||'Walk-in customer'),`<strong>${money(s.total)}</strong>`];if(!compact)cells.push([...new Set(state.payments.filter(p=>p.saleId===s.id&&p.kind==='Sale').map(p=>p.method))].join(' + ')||'Utang');cells.push(`<span class="pill ${debt?'warn':s.refunded?'red':''}">${status}</span>`);if(!compact)cells.push(s.refunded?'—':button('Refund','refund','secondary small','','data-id="'+s.id+'"'));return row(cells);}));}
function history(){return head('Transaction history','Every completed sale stays on record.',button('New sale','pos','','plus'))+`<section class="panel">${salesTable([...state.sales].reverse())}</section>`;}
function inventory(){const filtered=state.products.filter(p=>(p.name+' '+p.sku).toLowerCase().includes(search.toLowerCase()));return head('Products & inventory','Know what’s on the shelf, down to the last kilogram.',button('Stock history','movements','secondary','clock')+button('Add product','product','','plus'))+`<section class="stats">${stat('Products',state.products.length,'Rice varieties in your catalog','box')}${stat('Stock on hand',qty(state.products.reduce((a,p)=>a+p.stock,0))+' kg','All stock stored in base kilograms','grain')}${stat('Inventory value',money(state.products.reduce((a,p)=>a+p.stockValue,0)),'Weighted-average inventory cost','wallet')}${stat('Needs attention',lowProducts().length,'At or below minimum stock','box')}</section><div class="toolbar"><div class="search">${icon('search')}<input id="search" placeholder="Search name or SKU…" aria-label="Search products" value="${e(search)}"></div>${button('Export stock','export-stock','secondary','down')}</div><section class="panel">${table(['Product','Selling price','Average cost / kg','Stock','Sack size','Status',''],filtered.map(p=>row([`<div class="product-cell">${productThumb(p,'table-thumb')}<div><strong>${e(p.name)}</strong><small>${e(p.sku)} · ${e(p.category)}</small></div></div>`,`${money(p.price)} / kg<small>${money(p.sackPrice)} / sack</small>`,money(p.stock?Math.round(p.stockValue*1000/p.stock):p.cost),`<strong>${qty(p.stock)} kg</strong><small>Minimum ${qty(p.minimum)} kg</small>`,qty(p.sackGrams)+' kg',`<span class="pill ${p.stock<=p.minimum?'warn':''}">${p.stock===0?'Out of stock':p.stock<=p.minimum?'Low stock':'Available'}</span>`,button('Adjust','adjust','secondary small','','data-id="'+p.id+'"')+button(photoOf(photos,p.id)?'Photo':'Add photo','photo','secondary small','camera','data-id="'+p.id+'"')])) )}</section>`;}
function purchases(){return head('Purchases & restocking','Order in sacks. Receive in kilograms. Keep the costs clear.',button('New purchase','purchase','','plus'))+`<div class="notice green">Stock increases only when you receive a purchase. The new cost is combined with existing stock using weighted-average costing.</div><section class="panel">${table(['Supplier / Date','Product','Ordered quantity','Total cost','Status',''],[...state.purchases].reverse().map(p=>row([`<strong>${e(p.supplier)}</strong><small>${date(p.at)} · ${e(p.reference||'No supplier reference')}</small>`,e(p.productName),`${p.sacks} sacks × ${qty(p.sackGrams)} kg<small>${qty(p.quantity)} kg total</small>`,money(p.total),`<span class="pill ${p.receivedAt?'':'warn'}">${p.receivedAt?'Received':'Awaiting delivery'}</span>${p.receivedAt?`<small>${p.source==='Unpaid'?'Supplier balance unpaid':p.source+' payment'}</small>`:''}`,p.receivedAt?date(p.receivedAt):button('Receive stock','receive','small','','data-id="'+p.id+'"')])), 'No purchases yet. Create a purchase order when you’re ready to restock.')}</section>`;}
function customers(){return head('Customers & credit','A clearer utang notebook. Every payment in its proper place.',button('Add customer','customer','','plus'))+`<section class="stats">${stat('Outstanding credit',money(metrics(state).credit),'All customer balances','users',true)}${stat('Customers',state.customers.length,'Your neighborhood regulars','users')}${stat('Overdue customers',state.customers.filter(c=>overdue(c.id)).length,'Based on sale due dates','clock')}${stat('Collections today',money(state.payments.filter(x=>x.kind==='Collection'&&day(x.at)===day()).reduce((a,x)=>a+x.amount,0)),'Debt payments, not new sales','wallet')}</section><section class="panel">${table(['Customer','Outstanding','Credit limit','Status',''],state.customers.map(c=>row([`<strong>${e(c.name)}</strong><small>${e(c.phone||'No contact number')}</small>`,`<strong>${money(balance(state,c.id))}</strong>`,c.limit?money(c.limit):'No limit',`<span class="pill ${overdue(c.id)?'warn':''}">${overdue(c.id)?'Overdue':balance(state,c.id)?'Has balance':'All settled'}</span>`,`<div class="actions">${button('Statement','statement','secondary small','','data-id="'+c.id+'"')}${balance(state,c.id)?button('Collect','collection','small','','data-id="'+c.id+'"'):''}</div>`])) )}</section>`;}
function cash(){const session=currentSession(state),m=metrics(state);return head('Cash & expenses','Bilang ng pera. Know what should be in your cash box.',button('Record expense','expense','secondary','plus')+button(session?'Close session':'Open session',session?'close':'open','','wallet'))+`<section class="stats">${stat('Expected cash',money(expectedCash(state)),'Physical cash in the open session','wallet',true)}${stat('Opening float',money(session?.opening||0),session?'Opened '+date(session.openedAt)+' · '+time(session.openedAt):'No open cash session','store')}${stat('Expenses today',money(m.expenses),'Operating costs, all sources','receipt')}${stat('Digital collections',money(state.payments.filter(x=>day(x.at)===day()&&x.method!=='Cash').reduce((a,x)=>a+x.amount,0)),'Excluded from physical cash','wallet')}</section><div class="two-col"><section class="panel"><div class="panel-head"><h2>Cash movements</h2>${button('Cash in / out','cash-move','ghost','plus')}</div>${table(['Description','Date','Amount'],[...state.cashMoves].reverse().slice(0,10).map(x=>row([e(x.reason),date(x.at),money(x.amount)])))}</section><section class="panel"><div class="panel-head"><h2>Operating expenses</h2></div>${table(['Description','Source','Amount'],[...state.expenses].reverse().slice(0,10).map(x=>row([`<strong>${e(x.description)}</strong><small>${e(x.category)} · ${date(x.at)}</small>`,e(x.source),money(x.amount)])))}</section></div><section class="panel spacer"><div class="panel-head"><h2>Daily closing history</h2></div>${table(['Opened','Closed','Expected','Actual','Difference','Note'],[...state.sessions].filter(x=>x.closedAt).reverse().map(x=>row([date(x.openedAt),date(x.closedAt)+' · '+time(x.closedAt),money(x.expected),money(x.actual),`<span class="pill ${x.variance?'warn':''}">${money(x.variance)}</span>`,e(x.reason||'Balanced')])) )}</section>`;}
function reports(){const m=metrics(state,reportFrom,reportTo);const best=state.products.map(p=>{const lines=m.sales.filter(s=>!s.refunded).flatMap(s=>s.items).filter(x=>x.productId===p.id);return {name:p.name,quantity:lines.reduce((a,x)=>a+x.quantity,0),revenue:lines.reduce((a,x)=>a+x.revenue,0)};}).filter(p=>p.quantity).sort((a,b)=>b.quantity-a.quantity);return head('Business reports','Sales, collections, and profit — each tells a different story.',button('Export sales CSV','export-sales','secondary','down'))+`<div class="report-filters">${field('From','from','date',reportFrom,'id="report-from"')}${field('To','to','date',reportTo)}${button('Apply dates','filter-reports')}</div><section class="stats">${stat('Net sales',money(m.revenue),'Sales less refunds in this period','cart',true)}${stat('Gross profit',money(m.profit),'Net sales minus cost of goods','chart')}${stat('Operating profit',money(m.net),'Gross profit minus expenses','wallet')}${stat('Collections',money(m.collections),'Includes payments on old utang','wallet')}</section><div class="two-col"><section class="panel list-panel"><h2>Profit breakdown</h2>${[['Net sales',m.revenue],['Cost of goods sold',m.cost],['Gross profit',m.profit],['Operating expenses',m.expenses],['Estimated operating profit',m.net]].map(([l,n])=>`<div class="row"><span>${l}</span><strong>${money(n)}</strong></div>`).join('')}<p class="subtitle">Inventory losses affect stock value; this pilot’s operating profit does not yet include a separate inventory-loss expense.</p></section><section class="panel"><div class="panel-head"><h2>Best-selling products</h2></div>${table(['Product','Quantity','Before discounts'],best.map(p=>row([e(p.name),qty(p.quantity)+' kg',money(p.revenue)])))}<div class="table-foot">Fully refunded sales are excluded from this product ranking.</div></section></div><section class="panel spacer"><div class="panel-head"><h2>Sales in this period</h2></div>${salesTable([...m.sales].reverse())}</section>`;}
function settings(){return head('Your store, your way','A simple starting point for your business.')+`<div class="notice">This is a single-device pilot. Owner access is not a secure cashier permission system. Use sample records while testing; this version is not ready for live business or tax invoicing.</div><div class="two-col"><section class="panel list-panel"><h2>Store profile</h2><div class="row"><span>Name</span><strong>${e(state.store.name)}</strong></div><div class="row"><span>Owner</span><strong>${e(state.store.owner)}</strong></div><div class="row"><span>Address</span><strong>${e(state.store.address||'Not set')}</strong></div><div class="row"><span>Currency / Time zone</span><strong>PHP / Asia–Manila</strong></div><div class="spacer">${button('Edit store profile','profile','secondary')}</div></section><section class="panel list-panel"><h2>Keep your records safe</h2><p class="subtitle">Records are stored in this browser’s database. Clearing browser data removes them. Download a backup regularly and before changing devices.</p><div class="row"><span>Complete store backup</span>${button('Download JSON','backup','secondary small','down')}</div><div class="row"><span>Restore a StorePOS backup</span>${button('Restore','restore','secondary small')}</div><div class="row"><span>Recorded owner activity</span>${button('View audit trail','audit','secondary small')}</div></section><section class="panel list-panel"><h2>Start your own store</h2><p class="subtitle">The guided setup creates an empty store after downloading the current store backup. Add your products and opening receivables, then open a cash session.</p><div class="spacer">${button('Set up my store','setup','','arrow')}</div></section><section class="panel list-panel"><h2>What comes next</h2><div class="row"><span>Secure owner and cashier accounts</span><span class="pill warn">Production stage</span></div><div class="row"><span>Cloud backup & multi-device sync</span><span class="pill warn">Production stage</span></div><div class="row"><span>Partial returns & supplier payments</span><span class="pill warn">Planned</span></div><div class="row"><span>Registered tax invoicing</span><span class="pill warn">Separate rollout</span></div></section></div>`;}
// ---------- Sell screen ----------
const unitGrams=(p,unit)=>unit==='sack'?p.sackGrams:1000;
const linePrice=(line,p)=>Math.round(line.quantity*(line.unit==='sack'?p.sackPrice:p.price)/unitGrams(p,line.unit));
const productOf=line=>state.products.find(p=>p.id===line.productId);
function cartTotal(){return cart.reduce((a,x)=>a+linePrice(x,productOf(x)),0);}
function amountText(line,p){if(line.unit!=='sack')return `${qty(line.quantity)} kg`;const sacks=line.quantity/p.sackGrams;return `${count(sacks)} sack${sacks===1?'':'s'} · ${qty(line.quantity)} kg`;}
function toneOf(p){return [...p.id].reduce((a,c)=>a+c.charCodeAt(0),0)%TILE_TONES;}
function productThumb(p,cls){const src=photoOf(photos,p.id);return `<span class="thumb ${cls} ${src?'has-photo':'tone-'+toneOf(p)}">${src?`<img src="${src}" alt="">`:icon('grain')}</span>`;}
function orderLine(line,i){const p=productOf(line),step=unitGrams(p,line.unit);return `<div class="order-line">${productThumb(p,'line-thumb')}<button class="line-info" data-action="edit-cart" data-index="${i}" aria-label="Change amount of ${e(p.name)}"><strong>${e(p.name)}</strong><small>${amountText(line,p)}</small></button><strong class="line-price">${money(linePrice(line,p))}</strong><div class="stepper"><button class="step" data-action="step-cart" data-index="${i}" data-step="-1" aria-label="One less" ${line.quantity<=step?'disabled':''}>${icon('minus')}</button><button class="step" data-action="step-cart" data-index="${i}" data-step="1" aria-label="One more">${icon('plus')}</button></div><button class="icon-btn remove" data-action="remove-cart" data-index="${i}" aria-label="Remove ${e(p.name)}">${icon('trash')}</button></div>`;}
function pos(){const categories=[ALL_PRODUCTS,...new Set(state.products.map(p=>p.category))],products=state.products.filter(p=>(category===ALL_PRODUCTS||p.category===category)&&(p.name+' '+p.sku).toLowerCase().includes(search.toLowerCase())),total=cartTotal(),items=`${cart.length} item${cart.length===1?'':'s'}`;
 const sessionNotice=currentSession(state)?'':`<div class="notice session-closed"><div><strong>Open the cash box first · Buksan ang kaha</strong><span>Count the change money in the drawer before the first sale.</span></div>${button('Open cash box','open','','arrow')}</div>`;
 const tiles=products.map(p=>{const line=cart.find(x=>x.productId===p.id),out=!p.stock,low=!out&&p.stock<=p.minimum;return `<button class="product-tile ${line?'in-cart':''}" data-action="add-to-cart" data-id="${p.id}" ${out?'disabled':''}>${productThumb(p,'tile-thumb')}<strong class="tile-name">${e(p.name)}</strong><span class="tile-price">${money(p.price)}<small> / kg</small></span><span class="tile-stock ${out||low?'warn':''}">${out?'Out of stock · Ubos na':`${qty(p.stock)} kg left${low?' · Low':''}`}</span>${line?`<span class="tile-badge">${icon('check')} ${amountText(line,p)}</span>`:''}</button>`;}).join('')||(state.products.length?'<div class="empty">No rice matches your search.</div>':`<div class="empty"><strong>No rice yet.</strong><br>Add your rice first, then come back to sell.<br><br>${button('Add rice in Stocks','inventory','','box')}</div>`);
 const lines=cart.length?cart.map(orderLine).join(''):`<div class="empty">${icon('cart')}<br><strong>Tap a rice to start.</strong><br><span lang="tl">Pindutin ang bigas para magsimula.</span></div>`;
 return `${sessionNotice}<div class="sell"><section class="shelf" aria-label="Products"><div class="shelf-top"><div class="search">${icon('search')}<input id="search" placeholder="Search rice · Hanapin" aria-label="Search products" value="${e(search)}"></div>${button('Sales today','history','secondary','receipt')}</div><div class="filters">${categories.map(c=>`<button class="filter ${c===category?'active':''}" data-category="${e(c)}">${e(c)}</button>`).join('')}</div><div class="product-grid">${tiles}</div></section><section class="order" id="checkout" aria-label="Current order"><div class="order-head"><h2>Order <small lang="tl">· Bilihin</small></h2><span>${items}</span></div><div class="order-lines">${lines}</div><div class="order-foot"><div class="order-total"><span>Total</span><strong>${money(total)}</strong></div><div class="order-actions">${held?button('Resume · Ibalik','resume','secondary','clock'):button('Hold · Itabi','hold','secondary','clock')}${button('Clear · Burahin','clear-cart','secondary','trash')}</div><button class="btn pay-btn" data-action="checkout" ${!cart.length||!currentSession(state)?'disabled':''}>${icon('cash')} Checkout · Bayad</button><p class="order-note">Internal sales record · Not a tax invoice</p></div></section></div>${cart.length?`<button class="btn mobile-checkout" data-action="go-checkout">${icon('cart')} ${items} · ${money(total)} · See order</button>`:''}`;}
// onSubmit may return a function; it runs after the dialog closes (e.g. to show the receipt).
// variant is a CSS class for larger dialogs such as the keypad and checkout.
function modal(title,body,onSubmit,submit='Save',variant=''){const dialog=$('#modal');dialog.className=variant;dialog.innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="icon-btn" data-action="dismiss" aria-label="Close dialog">${icon('close')}</button></div><div class="modal-body">${onSubmit?'<form id="modal-form">':''}${body}<div class="error" id="modal-error" role="alert"></div><div class="modal-actions">${button(onSubmit?'Cancel':'Close','dismiss','secondary')}${onSubmit?`<button class="btn" type="submit">${submit}</button>`:''}</div>${onSubmit?'</form>':''}</div>`;dialog.showModal();dialog.querySelectorAll('[data-action="dismiss"]').forEach(b=>b.onclick=()=>dialog.close());if(onSubmit)$('#modal-form').onsubmit=async ev=>{ev.preventDefault();if(busy)return;busy=true;const submit=ev.target.querySelector('[type="submit"]');submit.disabled=true;try{const after=await onSubmit(Object.fromEntries(new FormData(ev.target)),ev.target);dialog.close();render();if(typeof after==='function')after();}catch(err){$('#modal-error').textContent=err.message;}finally{busy=false;submit.disabled=false;}};}

function validateBackup(s){if(s?.schema!==1||!s.store||typeof s.store.name!=='string'||typeof s.store.owner!=='string')throw Error('This is not a supported StorePOS backup.');for(const key of ['products','customers','sales','payments','ledger','movements','purchases','expenses','sessions','cashMoves','refunds','audit','processed'])if(!Array.isArray(s[key]))throw Error('Backup is missing '+key);const ids=new Set();for(const p of s.products){if(!p.id||ids.has(p.id)||!['name','sku','category'].every(k=>typeof p[k]==='string')||!['stock','stockValue','price','cost','minimum','sackPrice','sackGrams'].every(k=>Number.isSafeInteger(p[k])&&p[k]>=0)||!p.sackGrams)throw Error('Backup contains invalid product data.');ids.add(p.id);}for(const c of s.customers)if(typeof c.name!=='string'||!Number.isSafeInteger(c.limit)||c.limit<0)throw Error('Backup contains invalid customer data.');for(const key of ['payments','ledger','expenses','cashMoves'])for(const r of s[key])if(!Number.isSafeInteger(r.amount)||!Number.isFinite(Date.parse(r.at)))throw Error('Backup contains invalid financial records.');for(const sale of s.sales)if(!Array.isArray(sale.items)||!Number.isSafeInteger(sale.total)||!Number.isSafeInteger(sale.cost)||!Number.isFinite(Date.parse(sale.at))||sale.items.some(x=>!ids.has(x.productId)||!Number.isSafeInteger(x.quantity)||x.quantity<=0||!Number.isSafeInteger(x.cost)||!Number.isSafeInteger(x.revenue)))throw Error('Backup contains invalid sales records.');if(s.sessions.filter(x=>!x.closedAt).length>1)throw Error('Backup contains overlapping cash sessions.');}

 const totalNow=()=>{try{return Math.max(0,subtotal-scaled(formData().discount||'0'));}catch{return subtotal;}};
 function preview(){const d=formData(),out=$('#pay-result');try{const total=subtotal-scaled(d.discount||'0');if(total<0)throw Error();$('#co-total').textContent=money(total);const tender=tenderOf(d),unpaid=total-tender;$('#due-wrap').hidden=unpaid<=0;
   if(unpaid>0){out.className='pay-result warn';out.innerHTML=`<span>${d.method==='Utang'?'Utang · Listahan':'Unpaid · Kulang'}</span><strong>${money(unpaid)}</strong><small>${d.customerId?'Goes to this customer’s utang.':'Choose the customer above.'}</small>`;}
   else if(d.method==='Cash'){out.className='pay-result';out.innerHTML=`<span>Change · Sukli</span><strong>${money(tender-total)}</strong>`;}
   else if(tender>total){out.className='pay-result warn';out.innerHTML=`<span>More than the total</span><strong>${money(tender-total)}</strong><small>Check the amounts.</small>`;}
   else{out.className='pay-result';out.innerHTML=`<span>Fully paid · Bayad na</span><strong>${money(total)}</strong>`;}}
  catch{out.className='pay-result warn';out.innerHTML='<span>Check the amounts you typed.</span>';}}
 function showFields(){$('#pay-fields').innerHTML=payFields(formData().method,totalNow());typed=false;form.querySelectorAll('[data-cash]').forEach(b=>b.onclick=()=>{form.received.value=b.dataset.cash;typed=true;form.querySelectorAll('[data-cash]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));preview();});preview();}
 // Until the cashier types an amount, the amount received follows the total (e.g. after a discount).
 form.oninput=ev=>{const name=ev.target.name;if(name==='method'||(name==='discount'&&!typed))return showFields();if(['received','cash','digital'].includes(name))typed=true;preview();};
 showFields();form.querySelector('[type="submit"]').focus({preventScroll:true});}

// ---------- Product photo (owner, Stocks screen) ----------
function photoPad(p){const src=photoOf(photos,p.id);
 modal(`Photo · ${e(p.name)}`,`<div class="photo-pad">${productThumb(p,'photo-preview')}<p class="subtitle">Take or choose a clear picture of this rice or its sack. It shows on the Sell screen of this device.</p><label class="btn secondary photo-pick">${icon('camera')} ${src?'Change photo':'Choose photo'}<input type="file" accept="image/*" hidden></label>${src?`<button class="btn ghost" type="button" id="photo-remove">${icon('trash')} Remove photo</button>`:''}</div>`,null);
 const dialog=$('#modal'),picker=dialog.querySelector('input[type="file"]'),remove=$('#photo-remove');
 const done=message=>{dialog.close();render();toast(message);};
 picker.onchange=async()=>{try{await savePhoto(photos,p.id,await shrinkPhoto(picker.files[0]));done('Photo saved on this device.');}catch(err){$('#modal-error').textContent=err.message;}};
 if(remove)remove.onclick=async()=>{try{await removePhoto(photos,p.id);done('Photo removed.');}catch(err){$('#modal-error').textContent=err.message;}};}
function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;search='';render();window.scrollTo(0,0);});$('#app').querySelectorAll('[data-action]').forEach(b=>b.onclick=async()=>{try{await action(b.dataset.action,b);}catch(err){toast(err.message);}});document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>{category=b.dataset.category;render();});const input=$('#search');if(input)input.oninput=()=>{const start=input.selectionStart;search=input.value;render();$('#search').focus();$('#search').setSelectionRange(start,start);};}
function render(){if(online&&cloudUser?.role==='cashier'&&!['pos','history','customers','cash'].includes(page))page='pos';renderBase();if(online)decorateCloud();decorateMode();}
function decorateCloud(){const owner=cloudUser.role==='owner';const brand=$('.brand img');if(brand)brand.src=window.STOREPOS_ICON||'icon.svg';const saved=$('.saved');if(saved)saved.innerHTML='<span class="dot"></span> Shared store · Online';const picker=$('.store-picker small');if(picker)picker.textContent='Rice retail · Online store';const pilot=$('.pilot');if(pilot)pilot.innerHTML='<strong>StorePOS Online · Pilot</strong>Shared records across your devices.<br>Internet required for checkout.';const ownerBlock=$('.owner');if(ownerBlock)ownerBlock.innerHTML=`<span class="avatar">${e(cloudUser.name.slice(0,2).toUpperCase())}</span><div>${e(cloudUser.name)}<small>${owner?'Owner':'Cashier'} workspace</small></div>`;const actions=$('.top-actions');actions.insertAdjacentHTML('beforeend',`<button class="text-link" id="cloud-refresh">Refresh</button><button class="text-link" id="cloud-logout">Sign out</button>`);$('#cloud-refresh').onclick=()=>refreshCloud(true).catch(err=>toast(err.message));$('#cloud-logout').onclick=async()=>{if(pendingCommand()){toast('Confirm the pending save before signing out.');return;}if(cart.length||held){toast('Complete or clear your basket before signing out.');return;}try{await cloudCall('apiLogout',cloudToken());}catch{}cloudForget();state=null;cloudLoginScreen();};if(pendingCommand()){$('.workspace').insertAdjacentHTML('afterbegin','<div class="notice">A transaction needs confirmation. <button id="cloud-pending" class="text-link">Check pending save</button></div>');$('#cloud-pending').onclick=checkPendingCloud;}if(!owner){document.querySelectorAll('[data-page]').forEach(b=>{if(!['pos','customers','cash'].includes(b.dataset.page))b.remove();});document.querySelectorAll('[data-action]').forEach(b=>{if(['refund','customer','expense','cash-move'].includes(b.dataset.action))b.remove();});}if(page==='settings'&&owner){const workspace=$('.workspace');workspace.innerHTML=head('Your online store','One shared store, wherever you log in.')+`<div class="notice green">Records are saved to your private Google Sheet through Apps Script. Each staff member uses their own access account. Keep the database Sheet private.</div><div class="two-col"><section class="panel list-panel"><h2>Store profile</h2><div class="row"><span>Store name</span><strong>${e(state.store.name)}</strong></div><div class="row"><span>Business address</span><strong>${e(state.store.address||'Not set')}</strong></div><div class="spacer">${button('Edit store profile','profile','secondary')}</div></section><section class="panel list-panel"><h2>People & access</h2><p class="subtitle">Owners manage stock, costs, reports, and returns. Cashiers can sell, collect utang, and close their own register session.</p><div class="spacer"><button class="btn secondary" id="manage-staff">Manage staff</button></div></section><section class="panel list-panel"><h2>Backup & activity</h2><p class="subtitle">Download regular backups. Restore and store migration are controlled administrator operations.</p><div class="actions spacer">${button('Download backup','backup','secondary','down')}${button('Audit trail','audit','secondary','clock')}</div></section><section class="panel list-panel"><h2>Online pilot scope</h2><p class="subtitle">One shared cash register. The owner can monitor from another device. Simultaneous edits are checked before saving; outdated transactions must be reviewed. No offline transaction queue or registered tax invoicing yet.</p></section></div>`;bind();$('#manage-staff').onclick=()=>manageStaffCloud().catch(err=>toast(err.message));}}
function cloudLoginScreen(message=''){if($('#modal').open)$('#modal').close();$('#app').innerHTML=`<main class="login-page"><section class="login-card"><div class="brand"><img src="${window.STOREPOS_ICON||'icon.svg'}" alt=""><div><strong>StorePOS<span>YOUR STORE, WHEREVER YOU ARE.</span></strong></div></div><h1>Welcome to your store.</h1><p class="subtitle">Sign in to see the same sales, stocks, and utang on every device.</p><form id="cloud-login" class="spacer">${field('Username','username','text','','required autocomplete="username"')}${field('Access code','code','password','','required autocomplete="current-password"')}<p class="subtitle">Use the access code provided by your store owner.</p><div class="error spacer" id="login-error">${e(message)}</div><button class="btn full" type="submit">Sign in</button></form><button class="btn secondary full spacer" id="google-owner">Google owner sign-in</button><p class="subtitle" style="text-align:center">Online store · Internet connection required</p></section></main>`;$('#cloud-login').onsubmit=async ev=>{ev.preventDefault();const d=Object.fromEntries(new FormData(ev.target));ev.target.querySelector('button').disabled=true;try{const result=await cloudCall('apiSignIn',d.username,d.code.trim());cloudAccept(result);state=result.state;page=cloudUser.role==='owner'?'dashboard':'pos';render();}catch(err){$('#login-error').textContent=err.message;ev.target.querySelector('button').disabled=false;}};$('#google-owner').onclick=async()=>{try{const result=await cloudCall('apiOwnerSession');cloudAccept(result);state=result.state;page='dashboard';render();}catch(err){$('#login-error').textContent=err.message;}};}
async function startCloud(){if(cloudToken()){const result=await cloudCall('apiRead',cloudToken());setCloudUser(result.user);state=result.state;render();}else cloudLoginScreen();setInterval(()=>{if(!document.hidden&&state&&!busy&&!cart.length&&!held&&!$('#modal').open&&!pendingCommand()&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))refreshCloud(false).catch(()=>{});},60000);}
async function refreshCloud(explicit=false){if(busy)return;const result=await cloudCall('apiRead',cloudToken());const changed=result.state.revision!==state.revision;setCloudUser(result.user);state=result.state;if(changed){if($('#modal').open||cart.length){toast('Updated store records loaded. Review your current entry before saving.');}else render();}if(explicit)toast('Latest store records loaded.');}
async function checkPendingCloud(){const pending=pendingCommand();if(!pending||busy)return;busy=true;try{const result=await cloudCommand(pending.type,pending.data,pending.id,pending.expectedRevision);setCloudUser(result.user);state=result.state;if(result.conflict){render();toast('The store changed before this entry was saved. Review and enter it again.');return;}if(pending.type==='sale'){cart=[];cartId=uid();}render();toast('Confirmed: the transaction was saved once.');}catch(err){toast(err.message);if(!pendingCommand())render();}finally{busy=false;}}
async function manageStaffCloud(){const users=await cloudCall('apiListUsers',cloudToken());modal('Store access',table(['Name','Role','Status',''],users.map(u=>row([`${e(u.name)}<small>${e(u.username)}</small>`,e(u.role),u.active?'Active':'Disabled',u.active&&u.id!=='owner'&&u.id!==cloudUser.id?`<button class="text-link" data-disable-user="${e(u.id)}">Disable</button>`:'—'])))+'<div class="spacer"><button id="add-staff" class="btn">Add staff account</button></div>');$('#add-staff').onclick=()=>{$('#modal').close();modal('Add staff access',field('Name','name','text','','required')+field('Username','username','text','','required pattern="[a-zA-Z0-9._-]{3,40}"')+select('Role','role',[['cashier','Cashier'],['owner','Owner']]),async d=>{const result=await cloudCall('apiCreateUser',cloudToken(),d);setTimeout(()=>{modal('Save this access code',`<div class="notice">Share this code directly with ${e(result.user.name)}. It is shown only once. Anyone with the code can use this account.</div>${field('Username','staff-name','text',result.user.username,'readonly')}${field('Access code','access-code','text',result.code,'readonly')}<p class="subtitle">Store it securely. Disable this account if the code is lost or exposed.</p>`);},0);},'Create account');};$('#modal').querySelectorAll('[data-disable-user]').forEach(b=>b.onclick=()=>{const id=b.dataset.disableUser;$('#modal').close();modal('Disable staff access','<p class="subtitle">This immediately revokes the selected account’s sessions. Their transaction records remain.</p>',async()=>{await cloudCall('apiDisableUser',cloudToken(),id);toast('Staff access disabled.');},'Disable access');});}

photos=await openPhotos();
try{if(online){await startCloud();}else{db=await openDB();state=await read(db);if(!state){state=window.STOREPOS_PREVIEW?demoState():emptyState();await save(db,state,-1);}render();if(!window.STOREPOS_PREVIEW&&!window.STOREPOS_STANDALONE&&'serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});}}catch(err){if(online)cloudLoginScreen(err.message);else $('#app').innerHTML=`<div class="loading"><h1>We couldn’t open your store.</h1><p class="subtitle">${e(err.message)}</p><p class="subtitle">Allow browser storage, then reload. Existing records have not been reset.</p></div>`;}
window.addEventListener('beforeunload',ev=>{if(cart.length||held){ev.preventDefault();ev.returnValue='';}});

function decorateMode(){
 const brand=$('.brand img');if(brand&&window.STOREPOS_ICON)brand.src=window.STOREPOS_ICON;
 const preview=!!window.STOREPOS_PREVIEW;
 const mode=preview?'Preview · Sample data':online?'Online · Shared store':'Local · This device';
 const bar=document.createElement('div');bar.className='mode-banner';bar.innerHTML='<strong>'+mode+'</strong><span>'+(preview?'Try every workflow. Reload to reset; nothing is saved.':online?'Internet required. Separate from your local store.':'Saved in this browser. Back up regularly; no online sync.')+'</span>';
 $('.workspace').prepend(bar);
 if(preview){$('.saved').textContent='Preview · Not saved';document.querySelectorAll('[data-action="setup"],[data-action="restore"]').forEach(x=>x.remove());}
 document.querySelectorAll('input[type="number"]').forEach(x=>x.inputMode='decimal');
 const menu=$('.mobile-menu');if(menu)menu.setAttribute('aria-expanded','false');
}
})();</script></body></html>
